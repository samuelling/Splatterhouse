<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Splatterhouse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: full-bleed dusk canvas; readout top-left, one control dock pinned bottom-centre */
  --ink:#f7efe6;
  --ink-dim:rgba(247,239,230,.68);
  --glass:rgba(22,20,40,.46);
  --edge:rgba(247,239,230,.2);
  --accent:#ffb867;
  --hot:#ff6a4a;
  --display:'Barlow Condensed','Arial Narrow','Helvetica Neue',system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#2a2638;overflow:hidden;color:var(--ink);font-family:var(--display);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
canvas:active{cursor:grabbing}
#tag{position:fixed;left:16px;top:14px;max-width:calc(100% - 32px);display:flex;flex-direction:column;gap:2px;pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.5)}
#tag b{font-weight:600;font-size:21px;letter-spacing:.09em;text-transform:uppercase}
#tag i{font-style:normal;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.stat{font-family:var(--mono);font-size:11px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
#hint{position:fixed;left:16px;right:16px;bottom:190px;text-align:center;font-size:15px;letter-spacing:.06em;color:var(--ink-dim);
  pointer-events:none;transition:opacity .6s;text-shadow:0 1px 6px rgba(0,0,0,.6);text-wrap:balance}
#hint.off{opacity:0}
#dock{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:10px;
  padding:12px 14px;border-radius:18px;background:var(--glass);border:1px solid var(--edge);
  -webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);
  width:max-content;max-width:calc(100% - 32px)}
.row{display:flex;gap:8px;align-items:center;justify-content:center}
button{font:600 17px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);
  height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--edge);background:rgba(247,239,230,.07);cursor:pointer;white-space:nowrap}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{font:600 15px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);height:34px;padding:0 6px;border-radius:10px;
  border:1px solid var(--edge);background:rgba(247,239,230,.09);cursor:pointer;max-width:9.5em}
select option{color:#1b1a22;background:#f3ece2;text-transform:none}
button[aria-disabled="true"]{opacity:.42;cursor:default}
.seg{display:flex;border:1px solid var(--edge);border-radius:12px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;color:var(--ink-dim)}
.seg button[aria-pressed="true"],#bSlow[aria-pressed="true"]{background:var(--accent);color:#2b1d0c}
#bSplit:active{background:var(--accent);color:#2b1d0c}
#bFalcon{color:var(--hot);border-color:rgba(255,106,74,.5)}
#bFalcon:active,#bFalcon[data-on="1"]{background:var(--hot);color:#2a0d06}
.sl{gap:12px;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}
.sl span{white-space:nowrap}
.sl output{font-family:var(--mono);font-size:12px;min-width:4ch;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
input[type=range]{flex:1;min-width:96px;accent-color:var(--accent);height:24px}
#err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:20px;background:#2a2638}
#err[hidden]{display:none}
@media (prefers-reduced-motion:reduce){#hint{transition:none}}
@media (max-width:470px){.seg button{padding:0 9px;font-size:15px;letter-spacing:.05em}}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="tag"><b>Splatterhouse</b><i id="tagline">Murmuration</i><span class="stat" id="st1">building splats</span><span class="stat" id="st2"></span></div>
<div id="hint"></div>
<div id="dock">
  <div class="row">
    <div class="seg" role="group" aria-label="Camera">
      <button id="vMeadow" type="button" aria-pressed="true">Meadow</button>
      <button id="vShore" type="button" aria-pressed="false">Shore</button>
      <button id="vOrbit" type="button" aria-pressed="false">Orbit</button>
      <button id="vRide" type="button" aria-pressed="false">Ride</button>
      <button id="vFly" type="button" aria-pressed="false">Fly</button>
    </div>
  </div>
  <div class="row">
    <button id="bFalcon" type="button">Falcon</button>
    <button id="bSplit" type="button">Split</button>
    <button id="bSlow" type="button" aria-pressed="false">Slow-mo</button>
  </div>
  <div class="row sl">
    <select id="species" aria-label="Species">
      <option value="starling">Starlings</option><option value="dunlin">Dunlin</option><option value="jackdaw">Jackdaws</option>
      <option value="pigeon">Pigeons</option><option value="goose">Geese</option><option value="stork">White storks</option><option value="pteranodon">Pteranodon</option>
    </select>
    <input id="count" type="range" aria-label="Number of birds" min="150" max="2400" step="50" value="1000"><output id="countOut" for="count">1000</output></div>
</div>
<div id="err" hidden>This demo needs WebGL2, which this browser did not provide. Try a current Safari, Chrome or Firefox.</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('c');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,depth:false,stencil:false,powerPreference:'high-performance'});
if(!gl){document.getElementById('err').hidden=false;return;}

/* ---------------------------------------------------------------- utils */
let seed=20261115;
function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
function gauss(){let u=0;while(u===0)u=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(6.2831853*rnd());}
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const mix3=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
function nrm(v){const l=Math.hypot(v[0],v[1],v[2])||1;return[v[0]/l,v[1]/l,v[2]/l];}
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s);};
const num=(a,b)=>a-b;
function quatFromBasis(x,y,z){
  const m00=x[0],m10=x[1],m20=x[2],m01=y[0],m11=y[1],m21=y[2],m02=z[0],m12=z[1],m22=z[2];
  const tr=m00+m11+m22;let s;
  if(tr>0){s=Math.sqrt(tr+1)*2;return[(m21-m12)/s,(m02-m20)/s,(m10-m01)/s,.25*s];}
  if(m00>m11&&m00>m22){s=Math.sqrt(1+m00-m11-m22)*2;return[.25*s,(m01+m10)/s,(m02+m20)/s,(m21-m12)/s];}
  if(m11>m22){s=Math.sqrt(1+m11-m00-m22)*2;return[(m01+m10)/s,.25*s,(m12+m21)/s,(m02-m20)/s];}
  s=Math.sqrt(1+m22-m00-m11)*2;return[(m02+m20)/s,(m12+m21)/s,.25*s,(m10-m01)/s];
}
const qmul=(a,b)=>[a[3]*b[0]+a[0]*b[3]+a[1]*b[2]-a[2]*b[1],a[3]*b[1]-a[0]*b[2]+a[1]*b[3]+a[2]*b[0],
  a[3]*b[2]+a[0]*b[1]-a[1]*b[0]+a[2]*b[3],a[3]*b[3]-a[0]*b[0]-a[1]*b[1]-a[2]*b[2]];
const qZ=a=>[0,0,Math.sin(a/2),Math.cos(a/2)],qY=a=>[0,Math.sin(a/2),0,Math.cos(a/2)],qX=a=>[Math.sin(a/2),0,0,Math.cos(a/2)];
function q2m(q,m){const x=q[0],y=q[1],z=q[2],w=q[3];
  m[0]=1-2*(y*y+z*z);m[1]=2*(x*y+w*z);m[2]=2*(x*z-w*y);m[3]=2*(x*y-w*z);m[4]=1-2*(x*x+z*z);m[5]=2*(y*z+w*x);
  m[6]=2*(x*z+w*y);m[7]=2*(y*z-w*x);m[8]=1-2*(x*x+y*y);}

/* --------------------------------------------------------------- light */
const SUN=nrm([.30,.075,-.95]),SUNH=nrm([SUN[0],0,SUN[2]]);
const horizonJS=az=>mix3([.50,.42,.56],[1.0,.56,.28],Math.pow(az,2.2));
const azOf=(x,z)=>{const l=Math.hypot(x,z)||1;return(x/l*SUNH[0]+z/l*SUNH[2])*.5+.5;};
const TINT=[.62,.56,.46];

/* --------------------------------------------------------------- coast
   The sea lies toward the sunset. c is the distance seaward of the mean waterline (negative inland):
   meadow, c<-80 · thinning grass and low hummocks, -80..-50 · marram dunes, -50..-14 · beach, -14..0 · sea.
   The same functions are written again in GLSL below; the two must agree. */
const ZC=-212,SEA=-1.2;
const ss=(a,b,x)=>smooth((x-a)/(b-a));
const wig=x=>10*Math.sin(x*.011+.7)+5*Math.sin(x*.027+2);
const coastC=(x,z)=>ZC+wig(x)-z;
const baseH=c=>-1.2*ss(-14,-3,c)-1.8*ss(4,40,c);
function duneH(x,c){
  const E=ss(-52,-34,c)*(1-ss(-17,-7,c)),E2=ss(-80,-48,c)*(1-ss(-17,-8,c));
  const gap=1-.88*ss(.90,.985,.5+.5*Math.sin(x*.02+.37));                       // low passes where the sea shows through
  const r=.5+.5*Math.sin(c*.26+1.7*Math.sin(x*.021+.4)+.8*Math.sin(x*.047)),l=.5+.5*Math.sin(x*.09+c*.05+2)*Math.sin(x*.037-c*.08+.7);
  return E*gap*(1.1+2.6*r*(.5+.5*l))+E2*.55*(.5+.5*Math.sin(x*.19+1)*Math.sin(c*.23+2));
}
function groundH(x,z){const c=coastC(x,z);return c<-82?0:duneH(x,c)+baseH(c);}
let rseed=977;const rs=()=>((rseed=(Math.imul(rseed,1664525)+1013904223)>>>0)/4294967296);     // a second random stream, so adding the coast leaves the farm as it was

/* ------------------------------------------------------ static splats
   kind 0 near meadow (blades and flowers, tiled round the camera) · 1 unlit world · 2 birds
   3 lit world surfaces · 4 far meadow (tussocks and flower patches in two wider rings)
   Colour, flower drifts, paths and shadows come from two world-space maps, so every ring agrees. */
const coarse=matchMedia('(pointer:coarse)').matches||Math.min(innerWidth,innerHeight)<620;
const L=36,RF=17,D0SQ=36,FMIN=0.12,LEAFK=coarse?.65:1;
const DENS=coarse?96:132;
const nTuft=Math.round(DENS*L*L/144)*144,N1=coarse?36000:60048,N2=coarse?21600:36000;
const CAP=Math.ceil((2*nTuft+N1+N2+(coarse?150000:205000))/512)*512;
const D=new Float32Array(CAP*16);let N=0;
function add(px,py,pz,kind,sx,sy,sz,op,q,r,g,b,aux){
  if(N>=CAP)return N;
  const o=N*16;D[o]=px;D[o+1]=py;D[o+2]=pz;D[o+3]=kind;D[o+4]=sx;D[o+5]=sy;D[o+6]=sz;D[o+7]=op;
  D[o+8]=q[0];D[o+9]=q[1];D[o+10]=q[2];D[o+11]=q[3];D[o+12]=r;D[o+13]=g;D[o+14]=b;D[o+15]=aux;return N++;
}
function makeNoise(n){const g=new Float32Array(n*n);for(let i=0;i<g.length;i++)g[i]=rnd();
  return(x,z)=>{const u=((x/L+.5)%1+1)%1*n,v=((z/L+.5)%1+1)%1*n;const i=Math.floor(u),j=Math.floor(v);
    const fu=smooth(u-i),fv=smooth(v-j),i1=(i+1)%n,j1=(j+1)%n;
    return lerp(lerp(g[j*n+i],g[j*n+i1],fu),lerp(g[j1*n+i],g[j1*n+i1],fu),fv);};}
const nzA=makeNoise(7),nzC=makeNoise(29),QID=[0,0,0,1];
const cell0=new Int32Array(145),cell1=new Int32Array(145),cell2=new Int32Array(145);
const fLod=new Float32Array(2*nTuft+8),fLodQ=new Float32Array(2*nTuft+8);
const G_LUSH=[.25,.47,.13],G_DARK=[.10,.27,.10],G_TIP=[.62,.72,.30];
// near ring: individual blades, seed heads and flowers. Flower splats carry three random numbers instead of a
// colour; the shader turns them into a species (or hides them) from the flower map at their world position.
for(let c=0;c<144;c++){
  cell0[c]=N;const x0=-L/2+(c%12)*3,z0=-L/2+((c/12)|0)*3;
  for(let t=0;t<nTuft/144;t++){
    const x=x0+rnd()*3,z=z0+rnd()*3,a=nzA(x,z),c2=nzC(x,z);
    const lod=rnd(),kind=rnd(),ang=rnd()*6.2832,lean=.08+.26*rnd();
    const lx=Math.cos(ang)*lean,lz=Math.sin(ang)*lean;
    const yv=nrm([lx,1,lz]),ha=rnd()*6.2832,hv=[Math.cos(ha),0,Math.sin(ha)],dd=hv[0]*yv[0]+hv[2]*yv[2];
    const xv=nrm([hv[0]-yv[0]*dd,-yv[1]*dd,hv[2]-yv[2]*dd]),zv=cross(xv,yv),q=quatFromBasis(xv,yv,zv);
    let col=mix3(G_LUSH,G_DARK,a*.55);const j=.82+.36*rnd()+(c2-.5)*.25;col=[col[0]*j,col[1]*j,col[2]*j];
    const first=N;
    if(kind<.035){
      const h=.55+.32*rnd();
      add(x+lx*h*.5,h*.5,z+lz*h*.5,0,.007,h*.3,.007,.9,q,.55*j,.52*j,.27*j,.5);
      add(x+lx*h,h*.98,z+lz*h,0,.015,.055,.015,.95,q,.80*j,.66*j,.30*j,.99);
    }else if(kind<.25){
      const h=.24+.36*rnd(),r=.03+.02*rnd(),r1=rnd(),r2=rnd(),r3=rnd();
      add(x+lx*h*.45,h*.45,z+lz*h*.45,0,.008,h*.3,.008,.9,q,r1,r2,r3,4.4);
      add(x+lx*h,h,z+lz*h,0,r,r*.7,r,.97,QID,r1,r2,r3,2.97);
    }else{
      const h=(.20+.30*Math.pow(rnd(),1.4))*(.72+.6*a),w=.010+.013*rnd(),tip=mix3(col,G_TIP,.42);
      add(x+lx*h*.3,h*.3,z+lz*h*.3,0,w,h*.3,w*.55,.9,q,col[0]*.58,col[1]*.6,col[2]*.58,.36);
      add(x+lx*h*.68,h*.68,z+lz*h*.68,0,w*.8,h*.27,w*.45,.88,q,tip[0],tip[1],tip[2],.96);
    }
    const lq=Math.pow(lod,4/3);for(let k=first;k<N;k++){fLod[k]=lod;fLodQ[k]=lq;}
  }
}
cell0[144]=N;
// far rings: each splat stands for a tussock of grass or a patch of flowers
function farRing(lv,count,cells){
  const sc=lv===1?4:16,Lp=L*sc,cs=Lp/12,per=count/144;
  for(let c=0;c<144;c++){
    cells[c]=N;const x0=-Lp/2+(c%12)*cs,z0=-Lp/2+((c/12)|0)*cs;
    for(let i=0;i<per;i++){
      const x=x0+rnd()*cs,z=z0+rnd()*cs,j=.8+.4*rnd();
      if(rnd()<.32){
        const r=(lv===1?.085:.36)*(.8+.5*rnd()),h=(lv===1?.36:.5)+.16*rnd();
        add(x,h,z,4,r,r*.45,r,lv===1?.92:.72,QID,rnd(),rnd(),rnd(),lv+4);
      }else{
        const w=(lv===1?.085:.33)*(.75+.6*rnd()),h=(lv===1?.2:.4)*(.7+.7*rnd()),col=mix3([.16,.33,.09],[.42,.52,.19],rnd());
        add(x,h*.95,z,4,w,h,w*.8,.9,QID,col[0]*j,col[1]*j,col[2]*j,lv);
      }
    }
  }
  cells[144]=N;
}
farRing(1,N1,cell1);farRing(2,N2,cell2);
// the sand of the dunes: sheets of overlapping discs in the same three rings. The shader lays each one on the dune surface and hides those not on a dune.
const cellS=[new Int32Array(145),new Int32Array(145),new Int32Array(145)];
function sandRing(lv,g,sig){
  const sc=lv===0?1:lv===1?4:16,Lp=L*sc,cs=Lp/12,st=cellS[lv];
  for(let c=0;c<144;c++){st[c]=N;const x0=-Lp/2+(c%12)*cs,z0=-Lp/2+((c/12)|0)*cs;
    for(let a=0;a<g;a++)for(let b=0;b<g;b++){const r=sig*(.9+.25*rs());
      add(x0+(a+.5+(rs()-.5)*.6)*cs/g,0,z0+(b+.5+(rs()-.5)*.6)*cs/g,lv?4:0,r,r*.03,r,.97,QID,rs(),rs(),rs(),lv?lv+8:6.5);}}
  st[144]=N;
}
sandRing(0,4,.56);sandRing(1,5,1.8);sandRing(2,6,5.6);
const nMeadow=N;

/* ---- the lie of the land: barn, trees, fences, track ---- */
const BARN={x:-30,z:-56,th:.09};
const bcos=Math.cos(BARN.th),bsin=Math.sin(BARN.th);
const bw=p=>[BARN.x+p[0]*bcos+p[2]*bsin,p[1],BARN.z-p[0]*bsin+p[2]*bcos];
const bv=v=>[v[0]*bcos+v[2]*bsin,v[1],-v[0]*bsin+v[2]*bcos];
const SILO=bw([-7.7,0,-3]);
const TREES=[['oak',-12,-67,13],['oak',37,-33,10.5],['oak',-58,-82,12.5],['oak',96,-40,12],
  ['maple',17,-64,10],['maple',-45,-37,8.5],['maple',70,-130,11],
  ['birch',25,-74,11],['birch',27.5,-76,9.5],['birch',23.5,-77,10.2],['birch',-71,-50,10.5],['birch',-73.5,-52.5,9],['birch',-69.5,-54,9.6],
  ['spruce',34,-66,14],['spruce',39,-70,11],['spruce',30,-86,16],['spruce',42,-81,12.5],['spruce',-90,-120,15],['spruce',-95,-114,12],
  ['poplar',60,-102,18],['poplar',66,-103.5,19.5],['poplar',72,-105,17.5],['poplar',78,-106.5,19],['poplar',84,-108,18],
  ['willow',52,-47,9.5],['snag',-26,-104,9]];
for(let i=0;i<3;i++)for(let j=0;j<2;j++){const p=bw([-4+i*6.5+(rnd()-.5),0,-15.5-j*6.5+(rnd()-.5)]);TREES.push(['apple',p[0],p[2],4.4+rnd()*.8]);}
const CROWN={oak:.42,maple:.4,birch:.22,spruce:.2,poplar:.09,willow:.46,apple:.5,snag:.22};
const OBST=[BARN.x,BARN.z,8.5,9.5,SILO[0],SILO[2],2.5,13.5];
for(const t of TREES)OBST.push(t[1],t[2],t[3]*CROWN[t[0]]+1,t[3]+1);
const TRACK=[bw([0,0,7.6]),bw([0,0,15])].map(p=>[p[0],p[2]]).concat([[-22,-34],[-13,-27],[-8,-22],[-2,-14],[5,-6],[7,6],[3,30],[-8,70],[-20,130],[-24,205]]);
const GATE=[-8,-22];

// world maps, 512 m square and wrapping. A: dryness, flower density, species, vigour. B: short grass, shade, bare earth, lamplight.
const MA=512,MB=1024,MPT=MB/512,mapA=new Uint8Array(MA*MA*4),mapB=new Uint8Array(MB*MB*4);
{
  const lattice=p=>{const g=new Float32Array(p*p);for(let i=0;i<g.length;i++)g[i]=rnd();return g;};
  const fbm=(periods,amps)=>{const lat=periods.map(lattice);let tot=0;for(const a of amps)tot+=a;
    return(u,v)=>{let s=0;for(let o=0;o<lat.length;o++){const p=periods[o],g=lat[o],x=u*p,y=v*p,i=Math.floor(x),j=Math.floor(y),fx=smooth(x-i),fy=smooth(y-j),i0=i%p,j0=j%p,i1=(i0+1)%p,j1=(j0+1)%p;
      s+=amps[o]*lerp(lerp(g[j0*p+i0],g[j0*p+i1],fx),lerp(g[j1*p+i0],g[j1*p+i1],fx),fy);}return s/tot;};};
  const fDry=fbm([5,11,23,47],[1,.6,.35,.2]),fFl=fbm([7,15,31,61],[1,.7,.4,.25]),fSp=fbm([3,7,13],[1,.5,.25]),fVg=fbm([13,29,59,113],[1,.7,.5,.3]);

/* -------------------------------------------------------------- falcons */

function lookAt(){

/* -------------------------------------------------------- bird splats */
const LOGK=3900/Math.log(150);
const qp=[0,0,0,0,0],mp=[0,1,2,3,4].map(()=>new Float32Array(9)),op=[0,0,0,0,0];
const WA4=[0,0,0,0,0,0];
function wingAngles(ph,fl,tk,bn,A,g){
  const u=ph*.15915494-Math.floor(ph*.15915494),td=g.tau,psi=u<td?Math.PI*u/td:Math.PI*(1+(u-td)/(1-td));    // the downstroke takes the share tau of each beat
  const c=Math.cos(psi),sn=Math.sin(psi),dn=sn>0?sn:0,up=sn<0?-sn:0,up2=up*up,po=g.pose;
  // flapping: the arm beats from above the back to below the belly, swings forward on the way down, and on the way up the wrist folds
  // to cut the span to the species' span ratio while the hand wing twists leading edge up and trails the arm
  let th=g.th0+A*c,s1=.06-g.sw*dn+.3*g.fk*up2,th2=.3*A*Math.cos(psi-.7),s2=.16+g.fk*up2,tw=g.tw*(up-.35*dn);
  th=lerp(po[0]+.22*tk,th,fl);s1=lerp(po[1]+.42*tk,s1,fl);th2=lerp(-.03+.1*tk,th2,fl);s2=lerp(po[2]+.95*tk,s2,fl);tw*=fl;     // gliding, and tucking in a dive
  if(bn>.001){th=lerp(th,-.12,bn);s1=lerp(s1,1.2,bn);th2=lerp(th2,0,bn);s2=lerp(s2,2.0,bn);}                                // bounding: wings folded against the body
  WA4[0]=th;WA4[1]=s1;WA4[2]=th2;WA4[3]=s2;WA4[4]=tw;WA4[5]=fl*(1-bn)*sn;
}
const mv=(m,x,y,z)=>[m[0]*x+m[3]*y+m[6]*z,m[1]*x+m[4]*y+m[7]*z,m[2]*x+m[5]*y+m[8]*z];
function frames(p,f,u,sc,near){
  const qB=quatFromBasis(cross(u,f),u,f);qp[0]=qB;q2m(qB,mp[0]);op[0]=p;
  const th=WA4[0],s1=WA4[1],th2=WA4[2],s2=WA4[3],tw=WA4[4];
  for(const sd of[1,-1]){
    const ii=sd>0?1:3,oo=sd>0?2:4,qi=qmul(qB,qmul(qZ(sd*th),qmul(qY(sd*s1),qX(-.4*tw))));
    qp[ii]=qi;q2m(qi,mp[ii]);const o=mv(mp[0],sd*.018*sc,.012*sc,.022*sc);op[ii]=[p[0]+o[0],p[1]+o[1],p[2]+o[2]];
    if(near){const qo=qmul(qi,qmul(qZ(sd*th2),qmul(qY(sd*s2),qX(-.6*tw))));qp[oo]=qo;q2m(qo,mp[oo]);
      const w=mv(mp[ii],sd*.082*sc,0,0);op[oo]=[op[ii][0]+w[0],op[ii][1]+w[1],op[ii][2]+w[2]];}
  }
}
let nd=0;
function emit(tpl,pal,specK,sc){
  const v2=view[2],v6=view[6],v10=view[10],v14=view[14];
  for(let k=0;k<tpl.length;k++){
    const t=tpl[k],m=mp[t.part],o=op[t.part],lx=t.pos[0]*sc,ly=t.pos[1]*sc,lz=t.pos[2]*sc;
    const wx=o[0]+m[0]*lx+m[3]*ly+m[6]*lz,wy=o[1]+m[1]*lx+m[4]*ly+m[7]*lz,wz=o[2]+m[2]*lx+m[5]*ly+m[8]*lz;
    const q=qmul(qp[t.part],t.q),c=pal[t.role],b=nd*16;
    DY[b]=wx;DY[b+1]=wy;DY[b+2]=wz;DY[b+3]=2;DY[b+4]=t.sig[0]*sc;DY[b+5]=t.sig[1]*sc;DY[b+6]=t.sig[2]*sc;DY[b+7]=t.op;
    DY[b+8]=q[0];DY[b+9]=q[1];DY[b+10]=q[2];DY[b+11]=q[3];DY[b+12]=c[0];DY[b+13]=c[1];DY[b+14]=c[2];DY[b+15]=t.spec*specK+t.flags;
    const d=-(v2*wx+v6*wy+v10*wz+v14);

}
const PX=new Float32Array(MAXB);
function genBirds(){
  nd=0;const n=S.n,tpl=sp.tpl,pals=sp.pals,amp=sp.amp,gait=sp.gait;
  const m0=view[0],m4=view[4],m8=view[8],m12=view[12],m1=view[1],m5=view[5],m9=view[9],m13=view[13],m2=view[2],m6=view[6],m10=view[10],m14=view[14];
  let near=0;
  for(let i=0;i<n;i++){const i3=i*3,x=P[i3],y=P[i3+1],z=P[i3+2],dz=-(m2*x+m6*y+m10*z+m14);
    if(dz<.25){PX[i]=-1;continue;}
    const vx=m0*x+m4*y+m8*z+m12,vy=m1*x+m5*y+m9*z+m13,mg=.3*SIZE;
    if(Math.abs(vx)>dz*tanX*1.05+mg||Math.abs(vy)>dz*tanY*1.05+mg){PX[i]=-1;continue;}
    PX[i]=.42*SC[i]*focal/dz;if(PX[i]>14)near++;}
  let thr=14;while(near>NEARCAP){thr*=1.25;near=0;for(let i=0;i<n;i++)if(PX[i]>thr)near++;}
  for(let i=0;i<n;i++){
    if(PX[i]<0)continue;const i3=i*3,isNear=PX[i]>thr||(cam.mode==='ride'&&i===cam.rideBird);
    const f=[H[i3],H[i3+1],H[i3+2]];let u=[UPv[i3],UPv[i3+1],UPv[i3+2]];
    const fu=u[0]*f[0]+u[1]*f[1]+u[2]*f[2];u=nrm([u[0]-f[0]*fu,u[1]-f[1]*fu,u[2]-f[2]*fu]);
    wingAngles(PH[i],FLAP[i],TK[i],BND[i],amp*(.75+.25*DEM[i]),gait);
    const hb=-HEAVE*WA4[5];          // the body is driven up through the downstroke and falls back through the upstroke, so it sits lowest at mid-downstroke
    frames([P[i3]+u[0]*hb,P[i3+1]+u[1]*hb+BOF[i],P[i3+2]+u[2]*hb],f,u,SC[i],isNear);
    const tp=sp.shapes?sp.tpls[PALI[i]]:tpl;emit(isNear?tp.near:tp.far,pals[PALI[i]],1,SC[i]);

  for(const F of FALS){wingAngles(F.ph,F.flap,F.tk,0,.75,FGAIT);frames(F.p.slice(),F.f,F.u,2.4,true);emit(FALCT,FALC,.15,2.4);}
  if(sp.model==='soar'){      // thistledown carried up in the thermals, so the rising air can be seen
    const now=S.time;
    for(let k=0;k<3;k++){const t=TH[k],env=thermalEnv(t,now);if(env<.05)continue;
      for(let m=0;m<36;m++){const a=m*2.4+now*(.22+.1*hash(m))*t.dir,rr=t.r*(.2+.7*hash(m*1.7+k*9)),y=(hash(m*3.1+k)*t.top+now*t.w*.6)%t.top;
        const x=t.x+Math.cos(a)*rr,z=t.z+Math.sin(a)*rr,d=-(m2*x+m6*y+m10*z+m14);if(d<.5)continue;const b=nd*16;
        DY[b]=x;DY[b+1]=y;DY[b+2]=z;DY[b+3]=1;DY[b+4]=DY[b+5]=DY[b+6]=.09;DY[b+7]=.4*env*smooth((t.top-y)/15);
        DY[b+8]=0;DY[b+9]=0;DY[b+10]=0;DY[b+11]=1;DY[b+12]=1;DY[b+13]=.9;DY[b+14]=.72;DY[b+15]=0;
        DK[nd++]=d<40?d*1500:61600+Math.min(Math.log(d*.025)*LOGK,3900);}}
  }
}

/* ---------------------------------------------------------------- sort
   Each meadow ring is stored cell by cell, so whole cells outside the ring or the view are skipped unread. */
const RINGS=[{L:L,R:RF,Rin:0,st:cell0,ym:.3,mg:.9},{L:L*4,R:RF*4,Rin:RF*4*.18,st:cell1,ym:.3,mg:1},{L:L*16,R:RF*16,Rin:RF*16*.18,st:cell2,ym:.5,mg:2.5},
  {L:L,R:RF,Rin:0,st:cellS[0],ym:0,mg:1.4,sand:1},{L:L*4,R:RF*4,Rin:RF*4*.18,st:cellS[1],ym:0,mg:4,sand:1},{L:L*16,R:RF*16,Rin:RF*16*.18,st:cellS[2],ym:0,mg:12,sand:1}];
function buildOrder(){
  const m0=view[0],m4=view[4],m8=view[8],m12=view[12],m1=view[1],m5=view[5],m9=view[9],m13=view[13],m2=view[2],m6=view[6],m10=view[10],m14=view[14];
  const sx=cam.pos[0],sz=cam.pos[2],secX=Math.sqrt(1+tanX*tanX),secY=Math.sqrt(1+tanY*tanY);let n=0;
  for(let l=0;l<6;l++){
    const rg=RINGS[l],Lp=rg.L,iL=1/Lp,cs=Lp/12,cr=cs*.7072,R=rg.R,R2=R*R,Rin2=rg.Rin*rg.Rin,st=rg.st,lod=l===0,sandR=!!rg.sand;
    for(let c=0;c<144;c++){
      const ccx=-Lp/2+((c%12)+.5)*cs,ccz=-Lp/2+(((c/12)|0)+.5)*cs;
      const ox=-Lp*Math.floor((ccx-sx)*iL+.5),oz=-Lp*Math.floor((ccz-sz)*iL+.5),rx=ccx-sx+ox,rz=ccz-sz+oz,dc=Math.hypot(rx,rz);
      if(dc>R+cr||dc<rg.Rin-cr)continue;
      const wx=rx+sx,wz=rz+sz,cc=coastC(wx,wz);let ym=rg.ym,mg=rg.mg,br=cr+mg+.6,dune=false,h00=0,h10=0,h01=0,h11=0;const cx0=wx-cs*.5,cz0=wz-cs*.5;
      if(cc-cr*1.5>(sandR?0:-4))continue;                              // beach or open water: nothing grows there
      if(cc+cr*1.5>-84){dune=true;h00=groundH(cx0,cz0);h10=groundH(cx0+cs,cz0);h01=groundH(cx0,cz0+cs);h11=groundH(cx0+cs,cz0+cs);ym+=(h00+h10+h01+h11)*.25;br+=2.5;mg+=1.5;}
      else if(sandR)continue;
      const cvz=m2*wx+m6*ym+m10*wz+m14;if(cvz>br)continue;
      if(cvz<-br){if(Math.abs(m0*wx+m4*ym+m8*wz+m12)>-cvz*tanX+br*secX)continue;if(Math.abs(m1*wx+m5*ym+m9*wz+m13)>-cvz*tanY+br*secY)continue;}
      for(let i=st[c],e=st[c+1];i<e;i++){
        const o=i<<4,x=D[o]+ox,z=D[o+2]+oz,dx=x-sx,dz=z-sz,d2=dx*dx+dz*dz;
        if(d2>R2||d2<Rin2)continue;
        if(lod&&fLodQ[i]*d2>D0SQ&&fLod[i]>FMIN)continue;
        let y=D[o+1];if(dune){const u=(x-cx0)/cs,v=(z-cz0)/cs;y+=(h00*(1-u)+h10*u)*(1-v)+(h01*(1-u)+h11*u)*v;}
        const d=-(m2*x+m6*y+m10*z+m14);if(d<.25)continue;
        const lx=d*tanX+mg,vx=m0*x+m4*y+m8*z+m12;if(vx>lx||vx<-lx)continue;
        const ly=d*tanY+mg,vy=m1*x+m5*y+m9*z+m13;if(vy>ly||vy<-ly)continue;
        tmpIdx[n]=i;keys[n++]=d<40?d*1500:61600+Math.min(Math.log(d*.025)*LOGK,3900);
      }

  }
  for(let i=nMeadow;i<nProps;i++){
    const o=i<<4,d=-(m2*D[o]+m6*D[o+1]+m10*D[o+2]+m14);if(d<1)continue;
    tmpIdx[n]=i;keys[n++]=d<40?d*1500:61600+Math.min(Math.log(d*.025)*LOGK,3900);
  }
  for(let i=nProps;i<nStatic;i++){
    const o=i<<4,x=D[o],y=D[o+1],z=D[o+2],d=-(m2*x+m6*y+m10*z+m14);if(d<.15)continue;
    const lx=d*tanX+1.2,vx=m0*x+m4*y+m8*z+m12;if(vx>lx||vx<-lx)continue;
    const ly=d*tanY+1.2,vy=m1*x+m5*y+m9*z+m13;if(vy>ly||vy<-ly)continue;

  }
  for(let k=0;k<nd;k++){tmpIdx[n]=DYN0+k;keys[n++]=DK[k];}
  counts.fill(0);for(let i=0;i<n;i++)counts[keys[i]]++;

}

/* ---------------------------------------------------------------- loop */
let last=0,fpsT=0,fpsN=0,slow=0,drawn=0;
const st1=document.getElementById('st1'),st2=document.getElementById('st2');
function advance(dt){
  const steps=Math.max(1,Math.ceil(dt/.02)),h=dt/steps;
  for(let k=0;k<steps;k++){
    if(S.time-lastCluster>=.15){clusterNow=true;lastCluster=S.time;}
    if(sp.model==='flock'){if(S.auto&&S.time>=S.nextTurn)autoTurn();stepFlock(h);}else if(sp.model==='vee')stepVee(h);else stepSoar(h);
    if(FALS.length){for(const F of FALS)stepFalcon(F,h);
      if(FALS.some(F=>F.done)){for(let q=FALS.length-1;q>=0;q--)if(FALS[q].done)FALS.splice(q,1);syncFalconUI();}}
    S.time+=h;
  }
}
function frame(now){
  requestAnimationFrame(frame);
  const t=now/1000,rdt=Math.max(0,t-last),dt=Math.min(.05,rdt);last=t;
  if(!S.frozen)advance(dt*(S.slow?.2:1));
  updateCamera(Math.min(.12,rdt));
  render();
  fpsN++;fpsT+=rdt;
  if(dt>.03)slow++;else slow=Math.max(0,slow-1);
  if(slow>50&&scale>.55){scale*=.85;slow=0;}
  if(fpsT>=.5){
    st1.textContent=S.n.toLocaleString()+' '+sp.label.toLowerCase()+' · '+drawn.toLocaleString()+' splats · '+Math.round(fpsN/fpsT)+' fps';
    const fl=S.flocks,nf=FALS.length,grp=fl.length>1?fl.length+' '+sp.word[1]+' '+fl.slice(0,4).join('/'):'1 '+sp.word[0];
    st2.textContent=sp.model==='vee'?grp+' · '+Math.round(S.inForm*100)+'% on station · '+S.swaps+' lead changes'
      :sp.model==='soar'?grp+' · circling '+(sp.noun||'birds')+' climbing '+S.climb.toFixed(1)+' m/s'
      :grp+' · alignment '+S.pol.toFixed(2)+(nf?' · '+nf+(nf>1?' falcons':' falcon'):'');
    fpsT=fpsN=0;}
}
function render(){
  resize();
  const{f,r,u}=lookAt();
  genBirds();
  drawn=buildOrder();
  gl.viewport(0,0,VW,VH);
  gl.disable(gl.BLEND);gl.useProgram(BP);gl.bindVertexArray(bvao);
  gl.uniform3f(BU.uR,r[0]*tanX,r[1]*tanX,r[2]*tanX);gl.uniform3f(BU.uU,u[0]*tanY,u[1]*tanY,u[2]*tanY);gl.uniform3f(BU.uF,f[0],f[1],f[2]);
  gl.uniform3fv(BU.uSun,SUN);gl.uniform3fv(BU.uCam,cam.pos);gl.uniform3fv(BU.uTint,TINT);gl.uniform1i(BU.uMapA,1);gl.uniform1i(BU.uMapB,2);gl.uniform1f(BU.uTime,S.time);
  gl.drawArrays(gl.TRIANGLES,0,3);
  gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(PR);gl.bindVertexArray(vao);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);
  if(nd){const rows=Math.ceil(nd/512);gl.texSubImage2D(gl.TEXTURE_2D,0,0,TH0,2048,rows,gl.RGBA,gl.FLOAT,DY.subarray(0,rows*512*16));}
  gl.bindBuffer(gl.ARRAY_BUFFER,ib);gl.bufferSubData(gl.ARRAY_BUFFER,0,order,0,drawn);
  gl.uniform1i(U.uData,0);gl.uniform1i(U.uMapA,1);gl.uniform1i(U.uMapB,2);
  gl.uniformMatrix4fv(U.uView,false,view);gl.uniformMatrix4fv(U.uProj,false,proj);
  gl.uniform2f(U.uViewport,VW,VH);gl.uniform1f(U.uFocal,focal);gl.uniform2f(U.uLim,tanX*1.3,tanY*1.3);
  gl.uniform4f(U.uField,L,RF,S.time,1);gl.uniform2f(U.uScroll,cam.pos[0],cam.pos[2]);
  gl.uniform3fv(U.uSun,SUN);gl.uniform3fv(U.uCam,cam.pos);gl.uniform3fv(U.uTint,TINT);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,drawn);
}

/* --------------------------------------------------------------- input */
const hint=document.getElementById('hint'),pts=new Map();let pinch=0,hintTimer=0;
const HINTS=coarse?{meadow:'Drag to look · pinch to zoom · tap Meadow to re-track the flock',shore:'Drag to look · pinch to zoom · tap Shore again to follow the birds',orbit:'Drag to orbit · pinch to zoom',
    ride:'Drag to swing around your bird · pinch to move closer',fly:'Drag to look · pinch to fly forward or back'}
  :{meadow:'Drag to look · scroll to zoom · press W A S D to take off and fly',shore:'Drag to look · scroll to zoom · press Shore again to follow the birds · W A S D to fly',orbit:'Drag to orbit · scroll to zoom',
    ride:'Drag to swing around your bird · scroll to move closer',fly:'W A S D to fly · Space up · C down · Shift faster · drag to look · scroll sets speed'};
function showHint(){hint.textContent=HINTS[cam.mode];hint.classList.remove('off');clearTimeout(hintTimer);hintTimer=setTimeout(()=>hint.classList.add('off'),cam.mode==='fly'?12000:7000);}
function touched(){if(cam.mode!=='fly')hint.classList.add('off');}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);canvas.focus({preventScroll:true});pts.set(e.pointerId,[e.clientX,e.clientY]);pinch=0;touched();});
canvas.addEventListener('pointermove',e=>{
  const p=pts.get(e.pointerId);if(!p)return;const dx=e.clientX-p[0],dy=e.clientY-p[1];p[0]=e.clientX;p[1]=e.clientY;
  if(pts.size===1){
    const k=cam.zoom/Math.min(canvas.clientWidth,canvas.clientHeight);
    if(standing()){cam.track=false;cam.yaw+=dx*k;cam.pitch=clamp(cam.pitch+dy*k,-.25,1.5);}
    else if(cam.mode==='orbit'){cam.oauto=false;cam.oyaw-=dx*.0075;cam.opitch=clamp(cam.opitch+dy*.006,-.4,1.4);}
    else if(cam.mode==='ride')cam.rideYaw-=dx*.008;
    else{const sgn=e.pointerType==='mouse'?-1:1;     // mouse turns the head, a finger drags the scene
      cam.fyaw+=sgn*dx*k*1.3;cam.fpitch=clamp(cam.fpitch+sgn*dy*k*1.3,-1.45,1.45);}
  }else if(pts.size===2){const[a,b]=[...pts.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch)zoomBy(pinch/d,true);pinch=d;}
});
function zoomBy(k,isPinch){
  if(standing()){cam.autoZoom=false;cam.zoom=clamp(cam.zoom*k,.06,1.5);}
  else if(cam.mode==='orbit'){cam.oautoDist=false;cam.odist=clamp(cam.odist*k,8,260);}
  else if(cam.mode==='ride')cam.rideDist=clamp(cam.rideDist*k,.8,45);
  else if(isPinch){const d=-Math.log(k)*30,f=cam.fwd;cam.fpos[0]+=f[0]*d;cam.fpos[2]+=f[2]*d;cam.fpos[1]=Math.max(Math.max(groundH(cam.fpos[0],cam.fpos[2]),SEA)+.5,cam.fpos[1]+f[1]*d);}
  else cam.fspeed=clamp(cam.fspeed/k,3,60);
}
const up=e=>{pts.delete(e.pointerId);pinch=0;};
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('wheel',e=>{e.preventDefault();zoomBy(Math.exp(e.deltaY*.0012),false);touched();},{passive:false});
const MODES=['meadow','orbit','ride','fly','shore'];
const VB={meadow:document.getElementById('vMeadow'),orbit:document.getElementById('vOrbit'),ride:document.getElementById('vRide'),fly:document.getElementById('vFly'),shore:document.getElementById('vShore')};
function setMode(m,follow){
  if(m==='meadow'){cam.track=true;cam.autoZoom=true;}
  if(m==='shore'){            // first the view out to sea; press again to follow the birds from the beach
    if(follow||cam.mode==='shore'){cam.track=true;cam.autoZoom=true;}else{cam.track=false;cam.autoZoom=false;cam.yaw=SUNYAW-.3;cam.pitch=.05;cam.zoom=1.0;}}
  if(m==='orbit'&&cam.mode==='orbit'){cam.oautoDist=true;cam.oauto=true;}
  if(m==='ride'){let best=0,bc=9;for(let i=0;i<S.n;i++)if(CEN[i]<bc){bc=CEN[i];best=i;}cam.rideBird=best;cam.rpos=null;cam.rideYaw=0;}
  if(m==='fly'&&cam.mode!=='fly'){cam.fpos=cam.pos.slice();cam.fyaw=Math.atan2(cam.fwd[0],cam.fwd[2]);cam.fpitch=Math.asin(clamp(cam.fwd[1],-1,1));cam.fvel=[0,0,0];}
  cam.mode=m;for(const k in VB)VB[k].setAttribute('aria-pressed',k===m);showHint();
}
for(const k in VB)VB[k].onclick=e=>{setMode(k);e.currentTarget.blur();};
const bFalcon=document.getElementById('bFalcon'),bSlow=document.getElementById('bSlow'),bSplit=document.getElementById('bSplit');
function syncFalconUI(){const n=FALS.length;bFalcon.textContent=n?'Falcon ×'+n:'Falcon';bFalcon.dataset.on=n?'1':'0';
  if(n>=MAXF||!sp.falcon)bFalcon.setAttribute('aria-disabled','true');else bFalcon.removeAttribute('aria-disabled');}
function toggleSlow(){S.slow=!S.slow;bSlow.setAttribute('aria-pressed',S.slow);}
bFalcon.onclick=e=>{launchFalcon();e.currentTarget.blur();};
bSplit.onclick=e=>{forceSplit();e.currentTarget.blur();};
bSlow.onclick=e=>{toggleSlow();e.currentTarget.blur();};
const cnt=document.getElementById('count'),cntOut=document.getElementById('countOut');
cnt.oninput=()=>{resizeFlock(+cnt.value);cntOut.textContent=cnt.value;};
cnt.onchange=()=>cnt.blur();
const selSp=document.getElementById('species');
function setSpecies(key){
  sp=SPECIES[key];K=sp.K||7;V0C=sp.v0;VMIN=V0C*.5;VMAX=V0C*(sp.model==='vee'?1.4:2);RH=sp.rh||.2;SEPW=sp.sepw||.45;WS=sp.ws||7;WA=sp.wa||2.7;WC=sp.wc||2.2;NOISE=sp.noise??1.9;WR=sp.wr||4;SOAR=Object.assign({},SOAR0,sp.soar);
  WBF=sp.wbf;HEAVE=9.81/Math.pow(6.2832*WBF,2);      // how far the body rides up and down against the wings, in metres
  TREACT=sp.treact||.07;SPACE=sp.space||1;HOPM=2.3*SPACE;RSX=sp.roost[0];RSZ=sp.roost[1];R0=sp.roost[2];SIZE=sp.size;PAIRS=!!sp.pairs;HIER=!!sp.hier;FLAPMODE=sp.flap;BOUNDS=sp.gait.style==='bound';
  FALS.length=0;NC=0;S.flocks=[];S.swaps=0;S.inForm=0;S.climb=0;lastCluster=-9;clusterNow=false;S.nextTurn=S.time+6;
  const n=coarse?sp.n[1]:sp.n[0];cnt.min=sp.min;cnt.max=sp.max;cnt.step=sp.step;cnt.value=n;cntOut.textContent=n;
  LAB.fill(-1);spawn(n);
  cam.Cs=null;cam.tk=null;cam.rideBird=0;cam.rpos=null;cam.rideDist=3*Math.pow(SIZE,.8);cam.oautoDist=true;cam.track=true;cam.autoZoom=true;
  document.getElementById('tagline').textContent=sp.tag;selSp.value=key;
  if(sp.model==='flock')bSplit.removeAttribute('aria-disabled');else bSplit.setAttribute('aria-disabled','true');
  syncFalconUI();advance(1.5);
  if(sp.shore&&cam.mode==='meadow')setMode('shore',true);else if(!sp.shore&&cam.mode==='shore'&&cam.track)setMode('meadow');     // shore birds are watched from the beach
}
selSp.onchange=()=>{setSpecies(selSp.value);selSp.blur();};
const MOVE=new Set(['KeyW','KeyA','KeyS','KeyD','KeyC','Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight']);
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||e.ctrlKey||e.metaKey||e.altKey)return;
  const c=e.code;
  if(MOVE.has(c)){e.preventDefault();keysDown.add(c);if(cam.mode!=='fly')setMode('fly');return;}
  if(c==='ShiftLeft'||c==='ShiftRight'){keysDown.add('Shift');return;}
  if(e.repeat)return;
  if(c==='KeyF')launchFalcon();else if(c==='KeyX')forceSplit();else if(c==='KeyT')toggleSlow();
  else if(c>='Digit1'&&c<='Digit5')setMode(MODES[+c.slice(5)-1]);
});
addEventListener('keyup',e=>{const c=e.code;if(c==='Space')e.preventDefault();keysDown.delete(c);if(c==='ShiftLeft'||c==='ShiftRight')keysDown.delete('Shift');});
addEventListener('blur',()=>keysDown.clear());

resize();setSpecies('starling');
for(let i=0;i<40;i++)updateCamera(.2);
showHint();
window.__sim={S,cam,FALS,setSpecies,SPECIES,TH,setScale:v=>{scale=v;},ESC,TT,LAB,CLn,CLr,getP:()=>P,getH:()=>H,getV:()=>V,BND,FLAP,BOF,TIRE,SLOT,SIDE,LEADI,ROOT,MODE,TGT,MATE,RANK,getNC:()=>NC,advance,setMode,launchFalcon,forceSplit,startTurn,updateCamera,render,
  count:()=>({nStatic,nMeadow,props:nStatic-nProps,nd,drawn,n:S.n,cap:CAP})};
requestAnimationFrame(t=>{last=t/1000;frame(t);});
})();
</script>
