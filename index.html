<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Splatterhouse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: full-bleed dusk canvas; readout top-left, one control dock pinned bottom-centre */
  --ink:#f7efe6;
  --ink-dim:rgba(247,239,230,.68);
  --glass:rgba(22,20,40,.46);
  --edge:rgba(247,239,230,.2);
  --accent:#ffb867;
  --hot:#ff6a4a;
  --display:'Barlow Condensed','Arial Narrow','Helvetica Neue',system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#2a2638;overflow:hidden;color:var(--ink);font-family:var(--display);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
#tag{position:fixed;left:16px;top:14px;display:flex;flex-direction:column;gap:2px;pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.5)}
#tag b{font-weight:600;font-size:21px;letter-spacing:.09em;text-transform:uppercase}
#tag i{font-style:normal;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.stat{font-family:var(--mono);font-size:11px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
#hint{position:fixed;left:16px;right:16px;bottom:190px;text-align:center;font-size:15px;letter-spacing:.06em;color:var(--ink-dim);
  pointer-events:none;transition:opacity .6s;text-shadow:0 1px 6px rgba(0,0,0,.6)}
#hint.off{opacity:0}
#dock{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:10px;
  padding:12px 14px;border-radius:18px;background:var(--glass);border:1px solid var(--edge);
  -webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);
  width:max-content;max-width:calc(100% - 32px)}
.row{display:flex;gap:8px;align-items:center;justify-content:center}
button{font:600 17px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);
  height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--edge);background:rgba(247,239,230,.07);cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;border:1px solid var(--edge);border-radius:12px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;color:var(--ink-dim)}
.seg button[aria-pressed="true"],#bSlow[aria-pressed="true"]{background:var(--accent);color:#2b1d0c}
#bFalcon{color:var(--hot);border-color:rgba(255,106,74,.5)}
#bFalcon:active,#bFalcon[aria-disabled="true"]{background:var(--hot);color:#2a0d06}
.sl{gap:12px;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}
.sl span{white-space:nowrap}
.sl output{font-family:var(--mono);font-size:12px;min-width:4ch;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
input[type=range]{flex:1;min-width:120px;accent-color:var(--accent);height:24px}
#err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:20px;background:#2a2638}
#err[hidden]{display:none}
@media (prefers-reduced-motion:reduce){#hint{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tag"><b>Splatterhouse</b><i>Murmuration</i><span class="stat" id="st1">building splats</span><span class="stat" id="st2"></span></div>
<div id="hint">Drag to look · pinch to zoom · tap Meadow to re-track the flock</div>
<div id="dock">
  <div class="row">
    <div class="seg" role="group" aria-label="Camera">
      <button id="vMeadow" type="button" aria-pressed="true">Meadow</button>
      <button id="vOrbit" type="button" aria-pressed="false">Orbit</button>
      <button id="vRide" type="button" aria-pressed="false">Ride</button>
    </div>
  </div>
  <div class="row">
    <button id="bFalcon" type="button">Falcon</button>
    <button id="bSlow" type="button" aria-pressed="false">Slow-mo</button>
  </div>
  <label class="row sl" for="count"><span>Starlings</span>
    <input id="count" type="range" min="150" max="2400" step="50" value="1000"><output id="countOut" for="count">1000</output></label>
</div>
<div id="err" hidden>This demo needs WebGL2, which this browser did not provide. Try a current Safari, Chrome or Firefox.</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('c');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,depth:false,stencil:false,powerPreference:'high-performance'});
if(!gl){document.getElementById('err').hidden=false;return;}

/* ---------------------------------------------------------------- utils */
let seed=20261115;
function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
function gauss(){let u=0;while(u===0)u=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(6.2831853*rnd());}
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const mix3=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
function nrm(v){const l=Math.hypot(v[0],v[1],v[2])||1;return[v[0]/l,v[1]/l,v[2]/l];}
function quatFromBasis(x,y,z){
  const m00=x[0],m10=x[1],m20=x[2],m01=y[0],m11=y[1],m21=y[2],m02=z[0],m12=z[1],m22=z[2];
  const tr=m00+m11+m22;let s;
  if(tr>0){s=Math.sqrt(tr+1)*2;return[(m21-m12)/s,(m02-m20)/s,(m10-m01)/s,.25*s];}
  if(m00>m11&&m00>m22){s=Math.sqrt(1+m00-m11-m22)*2;return[.25*s,(m01+m10)/s,(m02+m20)/s,(m21-m12)/s];}
  if(m11>m22){s=Math.sqrt(1+m11-m00-m22)*2;return[(m01+m10)/s,.25*s,(m12+m21)/s,(m02-m20)/s];}
  s=Math.sqrt(1+m22-m00-m11)*2;return[(m02+m20)/s,(m12+m21)/s,.25*s,(m10-m01)/s];
}
const qmul=(a,b)=>[a[3]*b[0]+a[0]*b[3]+a[1]*b[2]-a[2]*b[1],a[3]*b[1]-a[0]*b[2]+a[1]*b[3]+a[2]*b[0],
  a[3]*b[2]+a[0]*b[1]-a[1]*b[0]+a[2]*b[3],a[3]*b[3]-a[0]*b[0]-a[1]*b[1]-a[2]*b[2]];
const qZ=a=>[0,0,Math.sin(a/2),Math.cos(a/2)],qY=a=>[0,Math.sin(a/2),0,Math.cos(a/2)];
function q2m(q,m){const x=q[0],y=q[1],z=q[2],w=q[3];
  m[0]=1-2*(y*y+z*z);m[1]=2*(x*y+w*z);m[2]=2*(x*z-w*y);m[3]=2*(x*y-w*z);m[4]=1-2*(x*x+z*z);m[5]=2*(y*z+w*x);
  m[6]=2*(x*z+w*y);m[7]=2*(y*z-w*x);m[8]=1-2*(x*x+y*y);}

/* --------------------------------------------------------------- light */
const SUN=nrm([.30,.075,-.95]),SUNH=nrm([SUN[0],0,SUN[2]]);
const horizonJS=az=>mix3([.50,.42,.56],[1.0,.56,.28],Math.pow(az,2.2));
const azOf=(x,z)=>{const l=Math.hypot(x,z)||1;return(x/l*SUNH[0]+z/l*SUNH[2])*.5+.5;};
const GROUND=[.13,.16,.08],TINT=[.62,.56,.46];

/* ------------------------------------------------------ static splats */
const coarse=matchMedia('(pointer:coarse)').matches||Math.min(innerWidth,innerHeight)<620;
const L=36,RF=17,D0SQ=36,FMIN=0.12;
const DENS=coarse?100:140;
const NGX=Math.round(L/0.7),nGround=NGX*NGX,nTuft=Math.round(DENS*L*L);
const CAP=Math.ceil((nGround+2*nTuft+4000)/512)*512;
const D=new Float32Array(CAP*16);let N=0;
function add(px,py,pz,kind,sx,sy,sz,op,q,r,g,b,aux){
  const o=N*16;D[o]=px;D[o+1]=py;D[o+2]=pz;D[o+3]=kind;D[o+4]=sx;D[o+5]=sy;D[o+6]=sz;D[o+7]=op;
  D[o+8]=q[0];D[o+9]=q[1];D[o+10]=q[2];D[o+11]=q[3];D[o+12]=r;D[o+13]=g;D[o+14]=b;D[o+15]=aux;return N++;
}
function makeNoise(n){const g=new Float32Array(n*n);for(let i=0;i<g.length;i++)g[i]=rnd();
  return(x,z)=>{const u=((x/L+.5)%1+1)%1*n,v=((z/L+.5)%1+1)%1*n;const i=Math.floor(u),j=Math.floor(v);
    const fu=smooth(u-i),fv=smooth(v-j),i1=(i+1)%n,j1=(j+1)%n;
    return lerp(lerp(g[j*n+i],g[j*n+i1],fu),lerp(g[j1*n+i],g[j1*n+i1],fu),fv);};}
const nA=makeNoise(7),nB=makeNoise(13),nC=makeNoise(29);
const G_LUSH=[.25,.47,.13],G_DRY=[.58,.58,.25],G_DARK=[.10,.27,.10],G_TIP=[.70,.74,.33];
const FLAT=[-0.70710678,0,0,0.70710678];
for(let ix=0;ix<NGX;ix++)for(let iz=0;iz<NGX;iz++){
  const x=-L/2+(ix+rnd())*L/NGX,z=-L/2+(iz+rnd())*L/NGX,n=nB(x,z),s=.5+.16*rnd(),j=.85+.3*rnd();
  const c=mix3([.12,.21,.07],[.24,.20,.10],smooth(n*1.6-.5));
  add(x,0,z,0,s,s,.03,1,FLAT,c[0]*j,c[1]*j,c[2]*j,0);
}
const FLOWERS=[[.97,.95,.88],[.98,.82,.22],[.72,.52,.92],[.93,.28,.22],[.97,.95,.88]];
const fLod=new Float32Array(CAP),fLodQ=new Float32Array(CAP);
for(let i=0;i<nTuft;i++){
  const x=(rnd()-.5)*L,z=(rnd()-.5)*L,a=nA(x,z),b=nB(x,z),c2=nC(x,z);
  const lod=rnd(),kind=rnd(),ang=rnd()*6.2832,lean=.08+.26*rnd();
  const lx=Math.cos(ang)*lean,lz=Math.sin(ang)*lean;
  const yv=nrm([lx,1,lz]),ha=rnd()*6.2832,hv=[Math.cos(ha),0,Math.sin(ha)],dd=hv[0]*yv[0]+hv[2]*yv[2];
  const xv=nrm([hv[0]-yv[0]*dd,-yv[1]*dd,hv[2]-yv[2]*dd]),zv=cross(xv,yv),q=quatFromBasis(xv,yv,zv);
  let col=mix3(G_LUSH,G_DRY,smooth(b*1.5-.35));col=mix3(col,G_DARK,a*.55);
  const j=.82+.36*rnd()+(c2-.5)*.25;col=[col[0]*j,col[1]*j,col[2]*j];
  const first=N;
  if(kind<.03){
    const h=.55+.32*rnd();
    add(x+lx*h*.5,h*.5,z+lz*h*.5,0,.007,h*.3,.007,.9,q,.55*j,.52*j,.27*j,.5);
    add(x+lx*h,h*.98,z+lz*h,0,.015,.055,.015,.95,q,.80*j,.66*j,.30*j,.99);
  }else if(kind<.058){
    const h=.30+.22*rnd(),f=FLOWERS[(rnd()*FLOWERS.length)|0],r=.022+.012*rnd();
    add(x+lx*h*.45,h*.45,z+lz*h*.45,0,.008,h*.28,.008,.9,q,col[0]*.8,col[1]*.8,col[2]*.8,.4);
    add(x+lx*h,h,z+lz*h,0,r,r*.75,r,.97,[0,0,0,1],f[0],f[1],f[2],.97);
  }else{
    const h=(.20+.30*Math.pow(rnd(),1.4))*(.72+.6*a),w=.010+.013*rnd(),tip=mix3(col,G_TIP,.42);
    add(x+lx*h*.3,h*.3,z+lz*h*.3,0,w,h*.3,w*.55,.9,q,col[0]*.58,col[1]*.6,col[2]*.58,.36);
    add(x+lx*h*.68,h*.68,z+lz*h*.68,0,w*.8,h*.27,w*.45,.88,q,tip[0],tip[1],tip[2],.96);
  }
  const lq=Math.pow(lod,4/3);for(let k=first;k<N;k++){fLod[k]=lod;fLodQ[k]=lq;}
}
const nField=N;
const qYa=a=>[0,Math.sin(a/2),0,Math.cos(a/2)];
for(let i=0;i<34;i++){const a=i/34*6.2832+rnd()*.2,d=900+rnd()*400,h=14+rnd()*30,x=Math.sin(a)*d,z=Math.cos(a)*d;
  const c=mix3([.16,.15,.22],horizonJS(azOf(x,z)),.55+.15*rnd());
  add(x,h*.3,z,1,90+rnd()*120,h,60,.97,qYa(a),c[0],c[1],c[2],0);}
for(let i=0;i<130;i++){const a=rnd()*6.2832,d=220+rnd()*260,cx=Math.sin(a)*d,cz=Math.cos(a)*d,m=3+(rnd()*6|0);
  const c=mix3([.035,.05,.035],horizonJS(azOf(cx,cz)),1-Math.exp(-d*.0022));
  for(let k=0;k<m;k++){const h=1.6+rnd()*2.6,j=.8+.4*rnd(),x=cx+(rnd()-.5)*14,z=cz+(rnd()-.5)*14;
    add(x,h*.9,z,1,1.4+rnd()*2.4,h,1.8,.95,qYa(rnd()*6.28),c[0]*j,c[1]*j,c[2]*j,0);}}
for(let i=0;i<16;i++){const a=rnd()*6.2832,d=900+rnd()*900,y=330+rnd()*420,cx=Math.sin(a)*d,cz=Math.cos(a)*d;
  const base=mix3([.42,.36,.52],[1.0,.60,.40],Math.pow(azOf(cx,cz),1.6));
  for(let k=0;k<12;k++){const w=30+rnd()*55,j=.88+.14*rnd(),lift=(rnd()-.5)*24;
    add(cx+(rnd()-.5)*260,y+lift,cz+(rnd()-.5)*120,1,w,4+rnd()*6,w*.35,.55,qYa(a+(rnd()-.5)*.4),base[0]*j,base[1]*j,base[2]*j,0);}}
const nStatic=N;

/* ------------------------------------------------------ bird templates */
// bird frame: +z forward, +y up, +x the bird's left. Splat thin axis = local z (used as normal).
const QI=[0,0,0,1];
const FL=quatFromBasis([1,0,0],[0,0,-1],[0,1,0]),FLB=quatFromBasis([1,0,0],[0,0,1],[0,-1,0]);
const FR=quatFromBasis([-1,0,0],[0,0,1],[0,1,0]),FRB=quatFromBasis([-1,0,0],[0,0,-1],[0,-1,0]);
const T=(part,pos,sig,q,role,op,spec,flags)=>({part,pos,sig,q,role,op,spec,flags});
const NEAR=[],FAR=[];
NEAR.push(T(0,[0,0,0],[.017,.015,.036],QI,0,.97,.9,4));
NEAR.push(T(0,[0,-.006,.034],[.015,.014,.02],QI,0,.97,.7,4));
NEAR.push(T(0,[0,.008,.07],[.012,.011,.013],QI,0,.98,.9,4));
NEAR.push(T(0,[0,.004,.094],[.0028,.0024,.009],QI,1,.98,.3,4));
NEAR.push(T(0,[0,.002,-.044],[.013,.011,.022],QI,0,.97,.6,4));
NEAR.push(T(0,[0,.002,-.083],[.014,.019,.0018],FL,4,.95,.4,0));
for(let k=0;k<7;k++){const a=(rnd()-.5)*2.6;NEAR.push(T(0,[Math.sin(a)*.016,Math.cos(a)*.0135,(rnd()-.45)*.07],[.0026,.0026,.0026],QI,5,.8,0,4));}
for(const[x,cs]of[[.014,.026],[.040,.024],[.064,.022]]){
  NEAR.push(T(1,[x,.0012,-.016],[.014,cs,.0015],FL,2,.97,.75,2),T(1,[x,-.0012,-.016],[.014,cs,.0015],FLB,3,.97,.08,2));
  NEAR.push(T(3,[-x,.0012,-.016],[.014,cs,.0015],FR,2,.97,.75,2),T(3,[-x,-.0012,-.016],[.014,cs,.0015],FRB,3,.97,.08,2));}
for(const[x,cs,zc,ss]of[[.013,.022,-.016,.013],[.037,.018,-.018,.013],[.060,.014,-.021,.013],[.081,.009,-.025,.012],[.097,.005,-.028,.008]]){
  NEAR.push(T(2,[x,.0012,zc],[ss,cs,.0015],FL,2,.97,.75,2),T(2,[x,-.0012,zc],[ss,cs,.0015],FLB,3,.97,.08,2));
  NEAR.push(T(4,[-x,.0012,zc],[ss,cs,.0015],FR,2,.97,.75,2),T(4,[-x,-.0012,zc],[ss,cs,.0015],FRB,3,.97,.08,2));}
FAR.push(T(0,[0,0,.005],[.017,.015,.055],QI,0,.97,.5,4));
FAR.push(T(1,[.085,0,-.018],[.06,.022,.0015],FL,6,.95,.2,0),T(3,[-.085,0,-.018],[.06,.022,.0015],FR,6,.95,.2,0));
// roles: body, beak, wing top, wing underside, tail, spot, far wing
const STAR=[[.032,.031,.037],[.30,.26,.13],[.028,.028,.033],[.20,.18,.16],[.035,.034,.04],[.70,.62,.48],[.045,.043,.046]];
const FALC=[[.26,.27,.30],[.55,.48,.20],[.27,.29,.33],[.62,.58,.52],[.24,.25,.29],[.80,.77,.70],[.3,.3,.33]];

/* ---------------------------------------------------------- flock model
   After StarDisplay (Hildenbrandt, Carere & Hemelrijk 2010): topological neighbours,
   cruise speed with relaxation, lift ∝ v², turning only by banking, roost attraction. */
const MAXB=2400,K=7,NEARCAP=coarse?160:260;
const G=9.81,V0C=10,TAUV=1.0,VMIN=5,VMAX=20,RH=.2,SEPW=.45,WS=7,WA=2.7,WC=1.6,WR=4.0,BMAX=1.2;
const REACT=.1,REFR=1.6,ZIG=.5,DAMP=.985,WBF=13.3,FLEE=10,DETECT=24;
const ROOST=[0,0,-70],R0=48;
let P=new Float32Array(MAXB*3),H=new Float32Array(MAXB*3),Pn=new Float32Array(MAXB*3),Hn=new Float32Array(MAXB*3);
const V=new Float32Array(MAXB),V0=new Float32Array(MAXB),BETA=new Float32Array(MAXB),UPv=new Float32Array(MAXB*3);
const NZ=new Float32Array(MAXB*3),CEN=new Float32Array(MAXB),SC=new Float32Array(MAXB),WB=new Float32Array(MAXB);
const PH=new Float32Array(MAXB),FLAP=new Float32Array(MAXB),FT=new Float32Array(MAXB),FS=new Uint8Array(MAXB),TK=new Float32Array(MAXB),DEM=new Float32Array(MAXB);
const ESC=new Float32Array(MAXB).fill(-99),ESCS=new Float32Array(MAXB),ESCA=new Float32Array(MAXB);
const ESCp=new Float32Array(MAXB),ESCSp=new Float32Array(MAXB),ESCAp=new Float32Array(MAXB);
const S={n:0,time:0,pol:0,nn:0,cen:[0,30,-70],frozen:false,slow:false};
const hPref=t=>Math.max(7,24+13*Math.sin(t*.043)+7*Math.sin(t*.117+1.3));

function initBird(i,px,py,pz,fx,fy,fz){
  const i3=i*3;P[i3]=px;P[i3+1]=py;P[i3+2]=pz;const f=nrm([fx,fy,fz]);H[i3]=f[0];H[i3+1]=f[1];H[i3+2]=f[2];
  V0[i]=V0C*(.96+.08*rnd());V[i]=V0[i];BETA[i]=0;UPv[i3]=0;UPv[i3+1]=1;UPv[i3+2]=0;NZ[i3]=NZ[i3+1]=NZ[i3+2]=0;
  SC[i]=.95+.1*rnd();WB[i]=WBF*(.95+.1*rnd());PH[i]=rnd()*6.28;FS[i]=1;FLAP[i]=1;FT[i]=rnd();TK[i]=0;DEM[i]=.5;
  ESC[i]=-99;ESCA[i]=0;CEN[i]=0;
}
function spawn(n){
  const k=Math.cbrt(n/1000);
  for(let i=0;i<n;i++){let x,y,z;do{x=rnd()*2-1;y=rnd()*2-1;z=rnd()*2-1;}while(x*x+y*y+z*z>1);
    initBird(i,ROOST[0]+40+x*13*k,30+y*4*k,ROOST[2]+z*9*k,(rnd()-.5)*.2,0,1);}
  S.n=n;
}
function resizeFlock(n){
  if(n>S.n){for(let i=S.n;i<n;i++){const j=(rnd()*S.n)|0,j3=j*3;
    initBird(i,P[j3]+(rnd()-.5)*3,P[j3+1]+(rnd()-.5)*2,P[j3+2]+(rnd()-.5)*3,H[j3]+(rnd()-.5)*.1,H[j3+1],H[j3+2]+(rnd()-.5)*.1);}}
  S.n=n;if(cam.rideBird>=n)cam.rideBird=0;
}

const CELL=2.5,HS=16384,HM=HS-1;
const cStart=new Int32Array(HS+1),cFill=new Int32Array(HS),cItem=new Int32Array(MAXB),CI=new Int32Array(MAXB*3),BH=new Int32Array(MAXB);
const hsh=(x,y,z)=>(Math.imul(x,73856093)^Math.imul(y,19349663)^Math.imul(z,83492791))&HM;
function buildGrid(n){

gl.enableVertexAttribArray(1);gl.vertexAttribIPointer(1,1,gl.UNSIGNED_INT,0,0);gl.vertexAttribDivisor(1,1);
const bvao=gl.createVertexArray();

/* -------------------------------------------------------------- camera */
const cam={mode:'meadow',track:true,autoZoom:true,yaw:Math.PI,pitch:.35,zoom:.9,
  oyaw:.6,opitch:-.06,odist:42,oauto:!matchMedia('(prefers-reduced-motion:reduce)').matches,
  rideBird:0,rideYaw:0,rideDist:3,rpos:null,rlook:null,
  pos:[0,1.55,0],fwd:[0,0,-1],up:[0,1,0],Cs:null,spread:.3};
const view=new Float32Array(16),proj=new Float32Array(16);
let VW=1,VH=1,scale=1,tanX=1,tanY=1,focal=1;
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,coarse?1.6:2)*scale;
  const w=Math.max(2,Math.round(canvas.clientWidth*dpr)),h=Math.max(2,Math.round(canvas.clientHeight*dpr));
  if(w!==VW||h!==VH){VW=canvas.width=w;VH=canvas.height=h;}
  const asp=VW/VH;let fovy=asp>=1?cam.zoom:2*Math.atan(Math.tan(cam.zoom/2)/asp);fovy=Math.min(fovy,2.3);
  tanY=Math.tan(fovy/2);tanX=tanY*asp;focal=VH/(2*tanY);
  const n=.1,f=6000;proj.fill(0);proj[0]=1/tanX;proj[5]=1/tanY;proj[10]=(f+n)/(n-f);proj[11]=-1;proj[14]=2*f*n/(n-f);
}
function flockStats(){
  const n=S.n;let cx=0,cy=0,cz=0;
  for(let i=0;i<n;i++){cx+=P[i*3];cy+=P[i*3+1];cz+=P[i*3+2];}
  let c=[cx/n,cy/n,cz/n];
  for(let it=0;it<3;it++){let sx=0,sy=0,sz=0,m=0;const r2=it?900:3600;
    for(let i=0;i<n;i++){const i3=i*3,dx=P[i3]-c[0],dy=P[i3+1]-c[1],dz=P[i3+2]-c[2];
      if(dx*dx+dy*dy+dz*dz<r2){sx+=P[i3];sy+=P[i3+1];sz+=P[i3+2];m++;}}
    if(m>n*.2)c=[sx/m,sy/m,sz/m];}
  S.cen=c;
}
function spreadFrom(p,c){
  const cd=nrm([c[0]-p[0],c[1]-p[1],c[2]-p[2]]),n=S.n,st=Math.max(1,(n/400)|0),a=[];
  for(let i=0;i<n;i+=st){const i3=i*3,dx=P[i3]-p[0],dy=P[i3+1]-p[1],dz=P[i3+2]-p[2],l=Math.hypot(dx,dy,dz)||1;
    a.push(Math.acos(clamp((dx*cd[0]+dy*cd[1]+dz*cd[2])/l,-1,1)));}
  a.sort((x,y)=>x-y);return a[Math.floor(a.length*.85)]||.2;
}
const wrapA=a=>{while(a>Math.PI)a-=6.2832;while(a<-Math.PI)a+=6.2832;return a;};
function updateCamera(dt){
  flockStats();
  const C=S.cen;if(!cam.Cs)cam.Cs=C.slice();
  const kc=1-Math.exp(-dt/.5);for(let k=0;k<3;k++)cam.Cs[k]+=(C[k]-cam.Cs[k])*kc;
  const Cs=cam.Cs;
  if(cam.mode==='meadow'){
    const p=cam.pos=[0,1.55,0];
    if(cam.track){
      const ty=Math.atan2(Cs[0]-p[0],Cs[2]-p[2]),tp=Math.atan2(Cs[1]-p[1],Math.hypot(Cs[0]-p[0],Cs[2]-p[2]));
      const k=1-Math.exp(-dt/.45);cam.yaw+=wrapA(ty-cam.yaw)*k;cam.pitch+=(tp-cam.pitch)*k;
    }
    if(cam.autoZoom){cam.spread=spreadFrom(p,Cs);const zt=clamp(cam.spread*2.7+.06,.14,1.3);cam.zoom+=(zt-cam.zoom)*(1-Math.exp(-dt/1.2));}
    cam.pitch=clamp(cam.pitch,-.25,1.5);
    cam.fwd=[Math.sin(cam.yaw)*Math.cos(cam.pitch),Math.sin(cam.pitch),Math.cos(cam.yaw)*Math.cos(cam.pitch)];cam.up=[0,1,0];
  }else if(cam.mode==='orbit'){
    if(cam.oauto)cam.oyaw+=dt*.05;
    const cp=Math.cos(cam.opitch);
    const p=[Cs[0]+cam.odist*Math.sin(cam.oyaw)*cp,Cs[1]+cam.odist*Math.sin(cam.opitch),Cs[2]+cam.odist*Math.cos(cam.oyaw)*cp];
    p[1]=Math.max(p[1],1.3);cam.pos=p;cam.fwd=nrm([Cs[0]-p[0],Cs[1]-p[1],Cs[2]-p[2]]);cam.up=[0,1,0];cam.zoom=.95;
  }else{
    const b=cam.rideBird*3,f=[H[b],H[b+1],H[b+2]],bp=[P[b],P[b+1],P[b+2]];
    let u=[UPv[b],UPv[b+1],UPv[b+2]];const fu=u[0]*f[0]+u[1]*f[1]+u[2]*f[2];u=nrm([u[0]-f[0]*fu,u[1]-f[1]*fu,u[2]-f[2]*fu]);
    const c=Math.cos(cam.rideYaw),s=Math.sin(cam.rideYaw),bx=-f[0]*cam.rideDist,bz=-f[2]*cam.rideDist;
    const tp=[bp[0]+bx*c+bz*s,bp[1]-f[1]*cam.rideDist+.28*cam.rideDist,bp[2]-bx*s+bz*c];
    const tl=[bp[0]+f[0]*3,bp[1]+f[1]*3,bp[2]+f[2]*3];
    if(!cam.rpos){cam.rpos=tp;cam.rlook=tl;}
    const k1=1-Math.exp(-dt/.16),k2=1-Math.exp(-dt/.1);
    for(let k=0;k<3;k++){cam.rpos[k]+=(tp[k]-cam.rpos[k])*k1;cam.rlook[k]+=(tl[k]-cam.rlook[k])*k2;}
    cam.pos=cam.rpos.slice();cam.fwd=nrm([cam.rlook[0]-cam.pos[0],cam.rlook[1]-cam.pos[1],cam.rlook[2]-cam.pos[2]]);
    cam.up=nrm([u[0]*.35,.65+u[1]*.35,u[2]*.35]);cam.zoom=1.05;
  }
}
function lookAt(){
  const e=cam.pos,f=cam.fwd,r=nrm(cross(f,cam.up)),u=cross(r,f);
  view[0]=r[0];view[4]=r[1];view[8]=r[2];view[12]=-(r[0]*e[0]+r[1]*e[1]+r[2]*e[2]);
  view[1]=u[0];view[5]=u[1];view[9]=u[2];view[13]=-(u[0]*e[0]+u[1]*e[1]+u[2]*e[2]);
  view[2]=-f[0];view[6]=-f[1];view[10]=-f[2];view[14]=f[0]*e[0]+f[1]*e[1]+f[2]*e[2];
  view[3]=view[7]=view[11]=0;view[15]=1;
  return{f,r,u};
}

/* -------------------------------------------------------- bird splats */
const qp=[0,0,0,0,0],mp=[0,1,2,3,4].map(()=>new Float32Array(9)),op=[0,0,0,0,0];
const WA4=[0,0,0,0];
function wingAngles(ph,fl,tk,A){
  const s=Math.sin(ph),c=Math.cos(ph),up=c>0?c:0;
  WA4[0]=lerp(.07+.22*tk,.10+A*s,fl);WA4[1]=lerp(.06+.42*tk,.06+.22*up,fl);
  WA4[2]=lerp(-.03+.1*tk,.30*A*Math.sin(ph-.7),fl);WA4[3]=lerp(.22+.95*tk,.16+.85*up*up,fl);
}
const mv=(m,x,y,z)=>[m[0]*x+m[3]*y+m[6]*z,m[1]*x+m[4]*y+m[7]*z,m[2]*x+m[5]*y+m[8]*z];
function frames(p,f,u,sc,near){
  const qB=quatFromBasis(cross(u,f),u,f);qp[0]=qB;q2m(qB,mp[0]);op[0]=p;
  const th=WA4[0],s1=WA4[1],th2=WA4[2],s2=WA4[3];
  for(const sd of[1,-1]){
    const ii=sd>0?1:3,oo=sd>0?2:4,qi=qmul(qB,qmul(qZ(sd*th),qY(sd*s1)));
    qp[ii]=qi;q2m(qi,mp[ii]);const o=mv(mp[0],sd*.018*sc,.012*sc,.022*sc);op[ii]=[p[0]+o[0],p[1]+o[1],p[2]+o[2]];
    if(near){const qo=qmul(qi,qmul(qZ(sd*th2),qY(sd*s2)));qp[oo]=qo;q2m(qo,mp[oo]);
      const w=mv(mp[ii],sd*.082*sc,0,0);op[oo]=[op[ii][0]+w[0],op[ii][1]+w[1],op[ii][2]+w[2]];}
  }
}
let nd=0;
function emit(tpl,pal,specK,sc){
  const v2=view[2],v6=view[6],v10=view[10],v14=view[14];
  for(let k=0;k<tpl.length;k++){
    const t=tpl[k],m=mp[t.part],o=op[t.part],lx=t.pos[0]*sc,ly=t.pos[1]*sc,lz=t.pos[2]*sc;
    const wx=o[0]+m[0]*lx+m[3]*ly+m[6]*lz,wy=o[1]+m[1]*lx+m[4]*ly+m[7]*lz,wz=o[2]+m[2]*lx+m[5]*ly+m[8]*lz;
    const q=qmul(qp[t.part],t.q),c=pal[t.role],b=nd*16;
    DY[b]=wx;DY[b+1]=wy;DY[b+2]=wz;DY[b+3]=2;DY[b+4]=t.sig[0]*sc;DY[b+5]=t.sig[1]*sc;DY[b+6]=t.sig[2]*sc;DY[b+7]=t.op;
    DY[b+8]=q[0];DY[b+9]=q[1];DY[b+10]=q[2];DY[b+11]=q[3];DY[b+12]=c[0];DY[b+13]=c[1];DY[b+14]=c[2];DY[b+15]=t.spec*specK+t.flags;
    const d=-(v2*wx+v6*wy+v10*wz+v14);
    DK[nd++]=d<40?Math.max(0,d)*1500:61600+Math.min((d-40)*2,3900);
  }
}
const PX=new Float32Array(MAXB);
function genBirds(){
  nd=0;const n=S.n;
  const m0=view[0],m4=view[4],m8=view[8],m12=view[12],m1=view[1],m5=view[5],m9=view[9],m13=view[13],m2=view[2],m6=view[6],m10=view[10],m14=view[14];
  let near=0;
  for(let i=0;i<n;i++){const i3=i*3,x=P[i3],y=P[i3+1],z=P[i3+2],dz=-(m2*x+m6*y+m10*z+m14);
    if(dz<.25){PX[i]=-1;continue;}
    const vx=m0*x+m4*y+m8*z+m12,vy=m1*x+m5*y+m9*z+m13,mg=.3;
    if(Math.abs(vx)>dz*tanX*1.05+mg||Math.abs(vy)>dz*tanY*1.05+mg){PX[i]=-1;continue;}
    PX[i]=.42*focal/dz;if(PX[i]>14)near++;}
  let thr=14;while(near>NEARCAP){thr*=1.25;near=0;for(let i=0;i<n;i++)if(PX[i]>thr)near++;}
  for(let i=0;i<n;i++){
    if(PX[i]<0)continue;const i3=i*3,isNear=PX[i]>thr||(cam.mode==='ride'&&i===cam.rideBird);
    const f=[H[i3],H[i3+1],H[i3+2]];let u=[UPv[i3],UPv[i3+1],UPv[i3+2]];
    const fu=u[0]*f[0]+u[1]*f[1]+u[2]*f[2];u=nrm([u[0]-f[0]*fu,u[1]-f[1]*fu,u[2]-f[2]*fu]);
    wingAngles(PH[i],FLAP[i],TK[i],.82*(.75+.25*DEM[i]));
    frames([P[i3],P[i3+1],P[i3+2]],f,u,SC[i],isNear);
    emit(isNear?NEAR:FAR,STAR,1,SC[i]);
  }
  if(FAL.on){wingAngles(FAL.ph,FAL.flap,FAL.tk,.75);frames(FAL.p.slice(),FAL.f,FAL.u,2.4,true);emit(NEAR,FALC,.15,2.4);}
}

/* ---------------------------------------------------------------- sort */
function buildOrder(){
  const m0=view[0],m4=view[4],m8=view[8],m12=view[12],m1=view[1],m5=view[5],m9=view[9],m13=view[13],m2=view[2],m6=view[6],m10=view[10],m14=view[14];
  const sx=cam.pos[0],sz=cam.pos[2],iL=1/L,R2=RF*RF;let n=0;
  for(let i=0;i<nField;i++){
    const o=i<<4;let x=D[o]-sx;x-=L*Math.floor(x*iL+.5);let z=D[o+2]-sz;z-=L*Math.floor(z*iL+.5);
    const d2=x*x+z*z;if(d2>R2)continue;
    const grass=i>=nGround;
    if(grass&&fLodQ[i]*d2>D0SQ&&fLod[i]>FMIN)continue;
    const y=D[o+1],wx=x+sx,wz=z+sz,vz=m2*wx+m6*y+m10*wz+m14;if(vz>-.25)continue;
    const mg=grass?.9:1.7,lx=-vz*tanX+mg,vx=m0*wx+m4*y+m8*wz+m12;if(vx>lx||vx<-lx)continue;
    const ly=-vz*tanY+mg,vy=m1*wx+m5*y+m9*wz+m13;if(vy>ly||vy<-ly)continue;
    tmpIdx[n]=i;keys[n++]=grass?Math.min(-vz*1500,59999):60000+Math.min(-vz*20,1500);
  }
  for(let i=nField;i<nStatic;i++){
    const o=i<<4,x=D[o],y=D[o+1],z=D[o+2],vz=m2*x+m6*y+m10*z+m14;if(vz>-1)continue;
    const d=-vz;tmpIdx[n]=i;keys[n++]=61600+Math.min((d-40)*2,3900);
  }
  for(let k=0;k<nd;k++){tmpIdx[n]=DYN0+k;keys[n++]=DK[k];}
  counts.fill(0);for(let i=0;i<n;i++)counts[keys[i]]++;
  let acc=0;for(let k=65535;k>=0;k--){const c=counts[k];counts[k]=acc;acc+=c;}
  for(let i=0;i<n;i++)order[counts[keys[i]]++]=tmpIdx[i];
  return n;
}

/* ---------------------------------------------------------------- loop */
let last=0,fpsT=0,fpsN=0,slow=0,drawn=0;
const st1=document.getElementById('st1'),st2=document.getElementById('st2');
function advance(dt){const steps=Math.max(1,Math.ceil(dt/.02)),h=dt/steps;for(let k=0;k<steps;k++){if(!(k%5))flockStats();stepFlock(h);stepFalcon(h);S.time+=h;}}
function frame(now){
  requestAnimationFrame(frame);
  const t=now/1000,dt=Math.min(.05,Math.max(0,t-last));last=t;
  if(!S.frozen)advance(dt*(S.slow?.2:1));
  updateCamera(dt);
  render();
  fpsN++;fpsT+=dt;
  if(dt>.03)slow++;else slow=Math.max(0,slow-1);
  if(slow>50&&scale>.55){scale*=.85;slow=0;}
  if(fpsT>=.5){
    st1.textContent=S.n.toLocaleString()+' starlings · '+drawn.toLocaleString()+' splats · '+Math.round(fpsN/fpsT)+' fps';
    st2.textContent='alignment '+S.pol.toFixed(2)+' · nearest neighbour '+S.nn.toFixed(2)+' m';fpsT=fpsN=0;}
}
function render(){
  resize();
  const{f,r,u}=lookAt();
  genBirds();
  drawn=buildOrder();
  gl.viewport(0,0,VW,VH);
  gl.disable(gl.BLEND);gl.useProgram(BP);gl.bindVertexArray(bvao);
  gl.uniform3f(BU.uR,r[0]*tanX,r[1]*tanX,r[2]*tanX);gl.uniform3f(BU.uU,u[0]*tanY,u[1]*tanY,u[2]*tanY);gl.uniform3f(BU.uF,f[0],f[1],f[2]);
  gl.uniform3fv(BU.uSun,SUN);gl.uniform3fv(BU.uGround,GROUND);gl.uniform3fv(BU.uCam,cam.pos);
  gl.drawArrays(gl.TRIANGLES,0,3);
  gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(PR);gl.bindVertexArray(vao);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);
  if(nd){const rows=Math.ceil(nd/512);gl.texSubImage2D(gl.TEXTURE_2D,0,0,TH0,2048,rows,gl.RGBA,gl.FLOAT,DY.subarray(0,rows*512*16));}
  gl.bindBuffer(gl.ARRAY_BUFFER,ib);gl.bufferSubData(gl.ARRAY_BUFFER,0,order,0,drawn);
  gl.uniform1i(U.uData,0);
  gl.uniformMatrix4fv(U.uView,false,view);gl.uniformMatrix4fv(U.uProj,false,proj);
  gl.uniform2f(U.uViewport,VW,VH);gl.uniform1f(U.uFocal,focal);gl.uniform2f(U.uLim,tanX*1.3,tanY*1.3);
  gl.uniform4f(U.uField,L,RF,S.time,1);gl.uniform2f(U.uScroll,cam.pos[0],cam.pos[2]);
  gl.uniform3fv(U.uSun,SUN);gl.uniform3fv(U.uCam,cam.pos);gl.uniform3fv(U.uGround,GROUND);gl.uniform3fv(U.uTint,TINT);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,drawn);
}

/* --------------------------------------------------------------- input */
const hint=document.getElementById('hint'),pts=new Map();let pinch=0,hintTimer=0;
const HINTS={meadow:'Drag to look · pinch to zoom · tap Meadow to re-track the flock',orbit:'Drag to orbit the flock · pinch to zoom',ride:'Drag to swing around your starling · pinch to move closer'};
function showHint(){hint.textContent=HINTS[cam.mode];hint.classList.remove('off');clearTimeout(hintTimer);hintTimer=setTimeout(()=>hint.classList.add('off'),7000);}
function touched(){hint.classList.add('off');}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);pinch=0;touched();});
canvas.addEventListener('pointermove',e=>{
  const p=pts.get(e.pointerId);if(!p)return;const dx=e.clientX-p[0],dy=e.clientY-p[1];p[0]=e.clientX;p[1]=e.clientY;
  if(pts.size===1){
    if(cam.mode==='meadow'){const k=cam.zoom/Math.min(canvas.clientWidth,canvas.clientHeight);cam.track=false;cam.yaw+=dx*k;cam.pitch=clamp(cam.pitch+dy*k,-.25,1.5);}
    else if(cam.mode==='orbit'){cam.oauto=false;cam.oyaw-=dx*.0075;cam.opitch=clamp(cam.opitch+dy*.006,-.4,1.4);}
    else cam.rideYaw-=dx*.008;
  }else if(pts.size===2){const[a,b]=[...pts.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch)zoomBy(pinch/d);pinch=d;}
});
function zoomBy(k){
  if(cam.mode==='meadow'){cam.autoZoom=false;cam.zoom=clamp(cam.zoom*k,.06,1.5);}
  else if(cam.mode==='orbit')cam.odist=clamp(cam.odist*k,8,260);
  else cam.rideDist=clamp(cam.rideDist*k,.8,14);
}
const up=e=>{pts.delete(e.pointerId);pinch=0;};
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('wheel',e=>{e.preventDefault();zoomBy(Math.exp(e.deltaY*.0012));touched();},{passive:false});
const VB={meadow:document.getElementById('vMeadow'),orbit:document.getElementById('vOrbit'),ride:document.getElementById('vRide')};
function setMode(m){
  if(m==='meadow'){cam.track=true;cam.autoZoom=true;}
  if(m==='ride'){let best=0,bc=9;for(let i=0;i<S.n;i++)if(CEN[i]<bc){bc=CEN[i];best=i;}cam.rideBird=best;cam.rpos=null;cam.rideYaw=0;}
  cam.mode=m;for(const k in VB)VB[k].setAttribute('aria-pressed',k===m);showHint();
}
for(const k in VB)VB[k].onclick=()=>setMode(k);
const bFalcon=document.getElementById('bFalcon'),bSlow=document.getElementById('bSlow');
bFalcon.onclick=launchFalcon;
bSlow.onclick=()=>{S.slow=!S.slow;bSlow.setAttribute('aria-pressed',S.slow);};
const cnt=document.getElementById('count'),cntOut=document.getElementById('countOut');
cnt.oninput=()=>{resizeFlock(+cnt.value);cntOut.textContent=cnt.value;};
addEventListener('keydown',e=>{if(e.repeat||e.target.tagName==='INPUT')return;const k=e.key.toLowerCase();
  if(k==='f')launchFalcon();else if(k==='s')bSlow.onclick();else if(k==='1')setMode('meadow');else if(k==='2')setMode('orbit');else if(k==='3')setMode('ride');});

const n0=coarse?600:1000;cnt.value=n0;cntOut.textContent=n0;spawn(n0);
advance(1.5);flockStats();cam.Cs=S.cen.slice();
showHint();
window.__sim={S,cam,FAL,ESC,getP:()=>P,advance,setMode,launchFalcon,updateCamera,render,count:()=>({nStatic,nd,drawn,n:S.n})};
requestAnimationFrame(t=>{last=t/1000;frame(t);});
})();
</script>
