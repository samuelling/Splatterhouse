<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Splatterhouse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: full-bleed dusk canvas; readout top-left, one control dock pinned bottom-centre */
  --ink:#f7efe6;
  --ink-dim:rgba(247,239,230,.68);
  --glass:rgba(22,20,40,.46);
  --edge:rgba(247,239,230,.2);
  --accent:#ffb867;
  --hot:#ff6a4a;
  --display:'Barlow Condensed','Arial Narrow','Helvetica Neue',system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#2a2638;overflow:hidden;color:var(--ink);font-family:var(--display);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
canvas:active{cursor:grabbing}
#tag{position:fixed;left:16px;top:14px;max-width:calc(100% - 32px);display:flex;flex-direction:column;gap:2px;pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.5)}
#tag b{font-weight:600;font-size:21px;letter-spacing:.09em;text-transform:uppercase}
#tag i{font-style:normal;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.stat{font-family:var(--mono);font-size:11px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
#hint{position:fixed;left:16px;right:16px;bottom:190px;text-align:center;font-size:15px;letter-spacing:.06em;color:var(--ink-dim);
  pointer-events:none;transition:opacity .6s;text-shadow:0 1px 6px rgba(0,0,0,.6);text-wrap:balance}
#hint.off{opacity:0}
#dock{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:10px;
  padding:12px 14px;border-radius:18px;background:var(--glass);border:1px solid var(--edge);
  -webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);
  width:max-content;max-width:calc(100% - 32px)}
.row{display:flex;gap:8px;align-items:center;justify-content:center}
button{font:600 17px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);
  height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--edge);background:rgba(247,239,230,.07);cursor:pointer;white-space:nowrap}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;border:1px solid var(--edge);border-radius:12px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;color:var(--ink-dim)}
.seg button[aria-pressed="true"],#bSlow[aria-pressed="true"]{background:var(--accent);color:#2b1d0c}
#bSplit:active{background:var(--accent);color:#2b1d0c}
#bFalcon{color:var(--hot);border-color:rgba(255,106,74,.5)}
#bFalcon:active,#bFalcon[data-on="1"]{background:var(--hot);color:#2a0d06}
#bFalcon[aria-disabled="true"]{opacity:.6}
.sl{gap:12px;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}
.sl span{white-space:nowrap}
.sl output{font-family:var(--mono);font-size:12px;min-width:4ch;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
input[type=range]{flex:1;min-width:120px;accent-color:var(--accent);height:24px}
#err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:20px;background:#2a2638}
#err[hidden]{display:none}
@media (prefers-reduced-motion:reduce){#hint{transition:none}}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="tag"><b>Splatterhouse</b><i>Murmuration</i><span class="stat" id="st1">building splats</span><span class="stat" id="st2"></span></div>
<div id="hint"></div>
<div id="dock">
  <div class="row">
    <div class="seg" role="group" aria-label="Camera">
      <button id="vMeadow" type="button" aria-pressed="true">Meadow</button>
      <button id="vOrbit" type="button" aria-pressed="false">Orbit</button>
      <button id="vRide" type="button" aria-pressed="false">Ride</button>
      <button id="vFly" type="button" aria-pressed="false">Fly</button>
    </div>
  </div>
  <div class="row">
    <button id="bFalcon" type="button">Falcon</button>
    <button id="bSplit" type="button">Split</button>
    <button id="bSlow" type="button" aria-pressed="false">Slow-mo</button>
  </div>
  <label class="row sl" for="count"><span>Starlings</span>
    <input id="count" type="range" min="150" max="2400" step="50" value="1000"><output id="countOut" for="count">1000</output></label>
</div>
<div id="err" hidden>This demo needs WebGL2, which this browser did not provide. Try a current Safari, Chrome or Firefox.</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('c');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,depth:false,stencil:false,powerPreference:'high-performance'});
if(!gl){document.getElementById('err').hidden=false;return;}

/* ---------------------------------------------------------------- utils */
let seed=20261115;
function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
function gauss(){let u=0;while(u===0)u=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(6.2831853*rnd());}
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const mix3=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
function nrm(v){const l=Math.hypot(v[0],v[1],v[2])||1;return[v[0]/l,v[1]/l,v[2]/l];}
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s);};
const num=(a,b)=>a-b;
function quatFromBasis(x,y,z){
  const m00=x[0],m10=x[1],m20=x[2],m01=y[0],m11=y[1],m21=y[2],m02=z[0],m12=z[1],m22=z[2];
  const tr=m00+m11+m22;let s;
  if(tr>0){s=Math.sqrt(tr+1)*2;return[(m21-m12)/s,(m02-m20)/s,(m10-m01)/s,.25*s];}
  if(m00>m11&&m00>m22){s=Math.sqrt(1+m00-m11-m22)*2;return[.25*s,(m01+m10)/s,(m02+m20)/s,(m21-m12)/s];}
  if(m11>m22){s=Math.sqrt(1+m11-m00-m22)*2;return[(m01+m10)/s,.25*s,(m12+m21)/s,(m02-m20)/s];}
  s=Math.sqrt(1+m22-m00-m11)*2;return[(m02+m20)/s,(m12+m21)/s,.25*s,(m10-m01)/s];
}
const qmul=(a,b)=>[a[3]*b[0]+a[0]*b[3]+a[1]*b[2]-a[2]*b[1],a[3]*b[1]-a[0]*b[2]+a[1]*b[3]+a[2]*b[0],
  a[3]*b[2]+a[0]*b[1]-a[1]*b[0]+a[2]*b[3],a[3]*b[3]-a[0]*b[0]-a[1]*b[1]-a[2]*b[2]];
const qZ=a=>[0,0,Math.sin(a/2),Math.cos(a/2)],qY=a=>[0,Math.sin(a/2),0,Math.cos(a/2)];
function q2m(q,m){const x=q[0],y=q[1],z=q[2],w=q[3];
  m[0]=1-2*(y*y+z*z);m[1]=2*(x*y+w*z);m[2]=2*(x*z-w*y);m[3]=2*(x*y-w*z);m[4]=1-2*(x*x+z*z);m[5]=2*(y*z+w*x);
  m[6]=2*(x*z+w*y);m[7]=2*(y*z-w*x);m[8]=1-2*(x*x+y*y);}

/* --------------------------------------------------------------- light */
const SUN=nrm([.30,.075,-.95]),SUNH=nrm([SUN[0],0,SUN[2]]);
const horizonJS=az=>mix3([.50,.42,.56],[1.0,.56,.28],Math.pow(az,2.2));
const azOf=(x,z)=>{const l=Math.hypot(x,z)||1;return(x/l*SUNH[0]+z/l*SUNH[2])*.5+.5;};
const GROUND=[.13,.16,.08],TINT=[.62,.56,.46];

/* ------------------------------------------------------ static splats
   kind 0 meadow (tiles around the camera) · 1 unlit world · 2 birds · 3 lit world surfaces */
const coarse=matchMedia('(pointer:coarse)').matches||Math.min(innerWidth,innerHeight)<620;
const L=36,RF=17,D0SQ=36,FMIN=0.12;
const DENS=coarse?100:140;
const NGX=Math.round(L/0.7),nGround=NGX*NGX,nTuft=Math.round(DENS*L*L);
const CAP=Math.ceil((nGround+2*nTuft+120000)/512)*512;
const D=new Float32Array(CAP*16);let N=0;
function add(px,py,pz,kind,sx,sy,sz,op,q,r,g,b,aux){
  if(N>=CAP)return N;
  const o=N*16;D[o]=px;D[o+1]=py;D[o+2]=pz;D[o+3]=kind;D[o+4]=sx;D[o+5]=sy;D[o+6]=sz;D[o+7]=op;
  D[o+8]=q[0];D[o+9]=q[1];D[o+10]=q[2];D[o+11]=q[3];D[o+12]=r;D[o+13]=g;D[o+14]=b;D[o+15]=aux;return N++;
}
function makeNoise(n){const g=new Float32Array(n*n);for(let i=0;i<g.length;i++)g[i]=rnd();
  return(x,z)=>{const u=((x/L+.5)%1+1)%1*n,v=((z/L+.5)%1+1)%1*n;const i=Math.floor(u),j=Math.floor(v);
    const fu=smooth(u-i),fv=smooth(v-j),i1=(i+1)%n,j1=(j+1)%n;
    return lerp(lerp(g[j*n+i],g[j*n+i1],fu),lerp(g[j1*n+i],g[j1*n+i1],fu),fv);};}
const nA=makeNoise(7),nB=makeNoise(13),nC=makeNoise(29);
const G_LUSH=[.25,.47,.13],G_DRY=[.58,.58,.25],G_DARK=[.10,.27,.10],G_TIP=[.70,.74,.33];
const FLAT=[-0.70710678,0,0,0.70710678];
for(let ix=0;ix<NGX;ix++)for(let iz=0;iz<NGX;iz++){
  const x=-L/2+(ix+rnd())*L/NGX,z=-L/2+(iz+rnd())*L/NGX,n=nB(x,z),s=.5+.16*rnd(),j=.85+.3*rnd();
  const c=mix3([.12,.21,.07],[.24,.20,.10],smooth(n*1.6-.5));
  add(x,0,z,0,s,s,.03,1,FLAT,c[0]*j,c[1]*j,c[2]*j,0);
}
const FLOWERS=[[.97,.95,.88],[.98,.82,.22],[.72,.52,.92],[.93,.28,.22],[.97,.95,.88]];
const fLod=new Float32Array(CAP),fLodQ=new Float32Array(CAP);
for(let i=0;i<nTuft;i++){
  const x=(rnd()-.5)*L,z=(rnd()-.5)*L,a=nA(x,z),b=nB(x,z),c2=nC(x,z);
  const lod=rnd(),kind=rnd(),ang=rnd()*6.2832,lean=.08+.26*rnd();
  const lx=Math.cos(ang)*lean,lz=Math.sin(ang)*lean;
  const yv=nrm([lx,1,lz]),ha=rnd()*6.2832,hv=[Math.cos(ha),0,Math.sin(ha)],dd=hv[0]*yv[0]+hv[2]*yv[2];
  const xv=nrm([hv[0]-yv[0]*dd,-yv[1]*dd,hv[2]-yv[2]*dd]),zv=cross(xv,yv),q=quatFromBasis(xv,yv,zv);
  let col=mix3(G_LUSH,G_DRY,smooth(b*1.5-.35));col=mix3(col,G_DARK,a*.55);
  const j=.82+.36*rnd()+(c2-.5)*.25;col=[col[0]*j,col[1]*j,col[2]*j];
  const first=N;
  if(kind<.03){
    const h=.55+.32*rnd();
    add(x+lx*h*.5,h*.5,z+lz*h*.5,0,.007,h*.3,.007,.9,q,.55*j,.52*j,.27*j,.5);
    add(x+lx*h,h*.98,z+lz*h,0,.015,.055,.015,.95,q,.80*j,.66*j,.30*j,.99);
  }else if(kind<.058){
    const h=.30+.22*rnd(),f=FLOWERS[(rnd()*FLOWERS.length)|0],r=.022+.012*rnd();
    add(x+lx*h*.45,h*.45,z+lz*h*.45,0,.008,h*.28,.008,.9,q,col[0]*.8,col[1]*.8,col[2]*.8,.4);
    add(x+lx*h,h,z+lz*h,0,r,r*.75,r,.97,[0,0,0,1],f[0],f[1],f[2],.97);
  }else{
    const h=(.20+.30*Math.pow(rnd(),1.4))*(.72+.6*a),w=.010+.013*rnd(),tip=mix3(col,G_TIP,.42);
    add(x+lx*h*.3,h*.3,z+lz*h*.3,0,w,h*.3,w*.55,.9,q,col[0]*.58,col[1]*.6,col[2]*.58,.36);
    add(x+lx*h*.68,h*.68,z+lz*h*.68,0,w*.8,h*.27,w*.45,.88,q,tip[0],tip[1],tip[2],.96);
  }
  const lq=Math.pow(lod,4/3);for(let k=first;k<N;k++){fLod[k]=lod;fLodQ[k]=lq;}
}
const nField=N;

/* ---- the roost: a gambrel barn, a silo and trees ---- */
const BARN={x:-30,z:-56,th:.09};
const bcos=Math.cos(BARN.th),bsin=Math.sin(BARN.th);
const bw=p=>[BARN.x+p[0]*bcos+p[2]*bsin,p[1],BARN.z-p[0]*bsin+p[2]*bcos];
const bv=v=>[v[0]*bcos+v[2]*bsin,v[1],-v[0]*bsin+v[2]*bcos];
const SILO=bw([-7.7,0,-3]);
const TREES=[[-12,-67,12.5,1.0,0],[17,-64,10,.85,1],[25,-73,12,.9,0],[33,-66,9,.85,0],[29,-84,11,.9,2],[37,-33,9.5,1.0,0],[-56,-80,11,.9,1],[-45,-37,8.5,.85,2]];
const OBST=[BARN.x,BARN.z,8.5,9.5,SILO[0],SILO[2],2.5,13.5];
for(const t of TREES)OBST.push(t[0],t[1],t[2]*.4*t[3]+1,t[2]+1);

// ground decals: long sunset shadows and the pool of lantern light
const SHD=[-SUNH[0],-SUNH[2]];
function shadow(x,z,wid,len,str){const n=6,q=quatFromBasis([SHD[0],0,SHD[1]],[SHD[1],0,-SHD[0]],[0,1,0]);
  for(let t=0;t<n;t++){const d=len*(t+.5)/n;
    add(x+SHD[0]*d,.04,z+SHD[1]*d,1,len/n*.95,wid*(.5+.35*t/n),.01,str*(1-.75*t/n),q,.02,.02,.04,0);}}
shadow(BARN.x,BARN.z,9,46,.5);shadow(SILO[0],SILO[2],2.2,40,.42);
for(const t of TREES)shadow(t[0],t[1],t[2]*.34*t[3],t[2]*3.6,.38);
{const p=bw([0,.05,9.6]);add(p[0],p[1],p[2],1,2.4,1.7,.01,.2,FLAT,1,.6,.25,0);}
const nDecal=N;

// far scenery: hills, distant copses, clouds
const qYa=a=>[0,Math.sin(a/2),0,Math.cos(a/2)];
for(let i=0;i<34;i++){const a=i/34*6.2832+rnd()*.2,d=900+rnd()*400,h=14+rnd()*30,x=Math.sin(a)*d,z=Math.cos(a)*d;
  const c=mix3([.16,.15,.22],horizonJS(azOf(x,z)),.55+.15*rnd());
  add(x,h*.3,z,1,90+rnd()*120,h,60,.97,qYa(a),c[0],c[1],c[2],0);}
for(let i=0;i<130;i++){const a=rnd()*6.2832,d=220+rnd()*260,cx=Math.sin(a)*d,cz=Math.cos(a)*d,m=3+(rnd()*6|0);
  const c=mix3([.035,.05,.035],horizonJS(azOf(cx,cz)),1-Math.exp(-d*.0022));
  for(let k=0;k<m;k++){const h=1.6+rnd()*2.6,j=.8+.4*rnd(),x=cx+(rnd()-.5)*14,z=cz+(rnd()-.5)*14;
    add(x,h*.9,z,1,1.4+rnd()*2.4,h,1.8,.95,qYa(rnd()*6.28),c[0]*j,c[1]*j,c[2]*j,0);}}
for(let i=0;i<16;i++){const a=rnd()*6.2832,d=900+rnd()*900,y=330+rnd()*420,cx=Math.sin(a)*d,cz=Math.cos(a)*d;
  const base=mix3([.42,.36,.52],[1.0,.60,.40],Math.pow(azOf(cx,cz),1.6));
  for(let k=0;k<12;k++){const w=30+rnd()*55,j=.88+.14*rnd(),lift=(rnd()-.5)*24;
    add(cx+(rnd()-.5)*260,y+lift,cz+(rnd()-.5)*120,1,w,4+rnd()*6,w*.35,.55,qYa(a+(rnd()-.5)*.4),base[0]*j,base[1]*j,base[2]*j,0);}}
const nProps=N;

// a flat panel of surface splats in barn-local coordinates; colFn(a,b) returns a colour or null for a hole
function panel(o,u,v,ul,vl,su,sv,colFn,aux){
  const q=quatFromBasis(bv(u),bv(v),bv(cross(u,v)));
  const nu=Math.max(1,Math.round(ul/(su*1.45))),nv=Math.max(1,Math.round(vl/(sv*1.45)));
  for(let i=0;i<nu;i++)for(let j=0;j<nv;j++){
    const a=(i+.5+(rnd()-.5)*.5)/nu*ul,b=(j+.5+(rnd()-.5)*.5)/nv*vl,c=colFn(a,b);if(!c)continue;
    const p=bw([o[0]+u[0]*a+v[0]*b,o[1]+u[1]*a+v[1]*b,o[2]+u[2]*a+v[2]*b]),jt=.92+.16*rnd();
    add(p[0],p[1],p[2],3,su*(.95+.2*rnd()),sv*(.95+.2*rnd()),.012,.97,q,c[0]*jt,c[1]*jt,c[2]*jt,aux||0);}
}
(function buildBarn(){
  const RED=[.50,.11,.08],RED2=[.39,.09,.07],WHT=[.86,.84,.78],DARK=[.05,.04,.04];
  const stone=(a,b)=>mix3([.33,.32,.30],[.52,.50,.46],hash(Math.floor(a/.5)+Math.floor(b/.25)*17.3));
  const boards=(a,b,h)=>{const k=Math.floor(a/.36),f=a/.36-k;
    if(f<.13)return[.15,.04,.03];
    let c=mix3(RED,RED2,hash(k+h*31));
    c=mix3(c,[.22,.14,.11],smooth(1-b/1.5)*.4+hash(k*7+h)*.12);
    if(hash(k*3.3+h*5)>.86)c=mix3(c,[.50,.41,.36],.5);
    return c;};
  const prof=x=>{const ax=Math.abs(x);return ax<=3.1?8.4-1.5*ax/3.1:6.9-2.5*(ax-3.1)/1.9;};
  const side=h=>(a,b)=>{
    if(b<.5)return stone(a,b);
    if(a<.24||a>13.76||b>4.2)return WHT;
    for(const w of[2.6,7,11.4]){const da=Math.abs(a-w),db=Math.abs(b-2.7);
      if(da<.62&&db<.62)return(da>.47||db>.47||da<.05||db<.05)?WHT:[.07,.08,.12];}
    return boards(a,b,h);};
  const front=(a,b)=>{const x=a-5,ax=Math.abs(x),pr=prof(x);if(b>pr)return null;
    if(b<.5&&ax>2.25)return stone(a,b);
    if(pr-b<.24||ax>4.76)return WHT;
    if(ax<2.25&&b<3.75){
      if(ax>2.08||b>3.58)return WHT;
      if(ax<.17)return null;
      const xl=(ax-.17)/1.91,yb=b/3.58;
      if(xl<.07||xl>.93||yb<.04||Math.abs(yb-xl)<.05||Math.abs(yb-(1-xl))<.05)return WHT;
      return mix3([.45,.10,.07],[.35,.08,.06],hash(Math.floor(ax/.24)));}
    if(ax<.85&&b>5.0&&b<6.5)return(ax>.7||b<5.14||b>6.36)?WHT:[.06,.05,.05];
    if(ax<.32&&b>7.2&&b<7.72)return DARK;
    return boards(a,b,3);};
  const back=(a,b)=>{const x=a-5,ax=Math.abs(x),pr=prof(x);if(b>pr)return null;
    if(b<.5&&ax>.6)return stone(a,b);
    if(pr-b<.24||ax>4.76)return WHT;
    if(ax<.6&&b<2.3)return(ax>.48||b>2.18)?WHT:[.30,.08,.06];
    if(ax<.5&&b>5.4&&b<6.3)return(ax>.38||b<5.52||b>6.18)?WHT:[.07,.08,.12];
    return boards(a,b,4);};
  const roof=s=>(a,b)=>{const k=Math.floor(a/.6),f=a/.6-k;
    let c=mix3([.36,.37,.40],[.47,.47,.48],hash(k+s*13));
    if(f<.1)c=[.19,.19,.21];
    return mix3(c,[.42,.22,.12],hash(k*1.7+s*3)*smooth(b/3)*.85*hash(k*9.1+Math.floor(b/.5)+s));};
  panel([5,0,7],[0,0,-1],[0,1,0],14,4.4,.07,.12,side(1));
  panel([-5,0,-7],[0,0,1],[0,1,0],14,4.4,.07,.12,side(2));
  panel([-5,0,7],[1,0,0],[0,1,0],10,8.4,.07,.12,front);
  panel([5,0,-7],[-1,0,0],[0,1,0],10,8.4,.07,.12,back);

    if(S.auto&&S.time>=S.nextTurn)autoTurn();
    stepFlock(h);
    if(FALS.length){for(const F of FALS)stepFalcon(F,h);
      if(FALS.some(F=>F.done)){for(let q=FALS.length-1;q>=0;q--)if(FALS[q].done)FALS.splice(q,1);syncFalconUI();}}
    S.time+=h;
  }
}
function frame(now){
  requestAnimationFrame(frame);
  const t=now/1000,rdt=Math.max(0,t-last),dt=Math.min(.05,rdt);last=t;
  if(!S.frozen)advance(dt*(S.slow?.2:1));
  updateCamera(Math.min(.12,rdt));
  render();
  fpsN++;fpsT+=rdt;
  if(dt>.03)slow++;else slow=Math.max(0,slow-1);
  if(slow>50&&scale>.55){scale*=.85;slow=0;}
  if(fpsT>=.5){
    st1.textContent=S.n.toLocaleString()+' starlings · '+drawn.toLocaleString()+' splats · '+Math.round(fpsN/fpsT)+' fps';
    const fl=S.flocks,nf=FALS.length;
    st2.textContent=(fl.length>1?fl.length+' flocks '+fl.slice(0,4).join('/'):'1 flock')+' · alignment '+S.pol.toFixed(2)+(nf?' · '+nf+(nf>1?' falcons':' falcon'):'');
    fpsT=fpsN=0;}
}
function render(){
  resize();
  const{f,r,u}=lookAt();
  genBirds();
  drawn=buildOrder();
  gl.viewport(0,0,VW,VH);
  gl.disable(gl.BLEND);gl.useProgram(BP);gl.bindVertexArray(bvao);
  gl.uniform3f(BU.uR,r[0]*tanX,r[1]*tanX,r[2]*tanX);gl.uniform3f(BU.uU,u[0]*tanY,u[1]*tanY,u[2]*tanY);gl.uniform3f(BU.uF,f[0],f[1],f[2]);
  gl.uniform3fv(BU.uSun,SUN);gl.uniform3fv(BU.uGround,GROUND);gl.uniform3fv(BU.uCam,cam.pos);
  gl.drawArrays(gl.TRIANGLES,0,3);
  gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(PR);gl.bindVertexArray(vao);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);
  if(nd){const rows=Math.ceil(nd/512);gl.texSubImage2D(gl.TEXTURE_2D,0,0,TH0,2048,rows,gl.RGBA,gl.FLOAT,DY.subarray(0,rows*512*16));}
  gl.bindBuffer(gl.ARRAY_BUFFER,ib);gl.bufferSubData(gl.ARRAY_BUFFER,0,order,0,drawn);
  gl.uniform1i(U.uData,0);
  gl.uniformMatrix4fv(U.uView,false,view);gl.uniformMatrix4fv(U.uProj,false,proj);
  gl.uniform2f(U.uViewport,VW,VH);gl.uniform1f(U.uFocal,focal);gl.uniform2f(U.uLim,tanX*1.3,tanY*1.3);
  gl.uniform4f(U.uField,L,RF,S.time,1);gl.uniform2f(U.uScroll,cam.pos[0],cam.pos[2]);
  gl.uniform3fv(U.uSun,SUN);gl.uniform3fv(U.uCam,cam.pos);gl.uniform3fv(U.uGround,GROUND);gl.uniform3fv(U.uTint,TINT);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,drawn);
}

/* --------------------------------------------------------------- input */
const hint=document.getElementById('hint'),pts=new Map();let pinch=0,hintTimer=0;
const HINTS=coarse?{meadow:'Drag to look · pinch to zoom · tap Meadow to re-track the flock',orbit:'Drag to orbit · pinch to zoom',
    ride:'Drag to swing around your starling · pinch to move closer',fly:'Drag to look · pinch to fly forward or back'}
  :{meadow:'Drag to look · scroll to zoom · press W A S D to take off and fly',orbit:'Drag to orbit · scroll to zoom',
    ride:'Drag to swing around your starling · scroll to move closer',fly:'W A S D to fly · Space up · C down · Shift faster · drag to look · scroll sets speed'};
function showHint(){hint.textContent=HINTS[cam.mode];hint.classList.remove('off');clearTimeout(hintTimer);hintTimer=setTimeout(()=>hint.classList.add('off'),cam.mode==='fly'?12000:7000);}
function touched(){if(cam.mode!=='fly')hint.classList.add('off');}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);canvas.focus({preventScroll:true});pts.set(e.pointerId,[e.clientX,e.clientY]);pinch=0;touched();});
canvas.addEventListener('pointermove',e=>{
  const p=pts.get(e.pointerId);if(!p)return;const dx=e.clientX-p[0],dy=e.clientY-p[1];p[0]=e.clientX;p[1]=e.clientY;
  if(pts.size===1){
    const k=cam.zoom/Math.min(canvas.clientWidth,canvas.clientHeight);
    if(cam.mode==='meadow'){cam.track=false;cam.yaw+=dx*k;cam.pitch=clamp(cam.pitch+dy*k,-.25,1.5);}
    else if(cam.mode==='orbit'){cam.oauto=false;cam.oyaw-=dx*.0075;cam.opitch=clamp(cam.opitch+dy*.006,-.4,1.4);}
    else if(cam.mode==='ride')cam.rideYaw-=dx*.008;
    else{const sgn=e.pointerType==='mouse'?-1:1;     // mouse turns the head, a finger drags the scene
      cam.fyaw+=sgn*dx*k*1.3;cam.fpitch=clamp(cam.fpitch+sgn*dy*k*1.3,-1.45,1.45);}
  }else if(pts.size===2){const[a,b]=[...pts.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch)zoomBy(pinch/d,true);pinch=d;}
});
function zoomBy(k,isPinch){
  if(cam.mode==='meadow'){cam.autoZoom=false;cam.zoom=clamp(cam.zoom*k,.06,1.5);}
  else if(cam.mode==='orbit'){cam.oautoDist=false;cam.odist=clamp(cam.odist*k,8,260);}
  else if(cam.mode==='ride')cam.rideDist=clamp(cam.rideDist*k,.8,14);
  else if(isPinch){const d=-Math.log(k)*30,f=cam.fwd;cam.fpos[0]+=f[0]*d;cam.fpos[1]=Math.max(.5,cam.fpos[1]+f[1]*d);cam.fpos[2]+=f[2]*d;}
  else cam.fspeed=clamp(cam.fspeed/k,3,60);
}
const up=e=>{pts.delete(e.pointerId);pinch=0;};
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('wheel',e=>{e.preventDefault();zoomBy(Math.exp(e.deltaY*.0012),false);touched();},{passive:false});
const MODES=['meadow','orbit','ride','fly'];
const VB={meadow:document.getElementById('vMeadow'),orbit:document.getElementById('vOrbit'),ride:document.getElementById('vRide'),fly:document.getElementById('vFly')};
function setMode(m){
  if(m==='meadow'){cam.track=true;cam.autoZoom=true;}
  if(m==='orbit'&&cam.mode==='orbit'){cam.oautoDist=true;cam.oauto=true;}
  if(m==='ride'){let best=0,bc=9;for(let i=0;i<S.n;i++)if(CEN[i]<bc){bc=CEN[i];best=i;}cam.rideBird=best;cam.rpos=null;cam.rideYaw=0;}
  if(m==='fly'&&cam.mode!=='fly'){cam.fpos=cam.pos.slice();cam.fyaw=Math.atan2(cam.fwd[0],cam.fwd[2]);cam.fpitch=Math.asin(clamp(cam.fwd[1],-1,1));cam.fvel=[0,0,0];}
  cam.mode=m;for(const k in VB)VB[k].setAttribute('aria-pressed',k===m);showHint();
}
for(const k in VB)VB[k].onclick=e=>{setMode(k);e.currentTarget.blur();};
const bFalcon=document.getElementById('bFalcon'),bSlow=document.getElementById('bSlow'),bSplit=document.getElementById('bSplit');
function syncFalconUI(){const n=FALS.length;bFalcon.textContent=n?'Falcon ×'+n:'Falcon';bFalcon.dataset.on=n?'1':'0';
  if(n>=MAXF)bFalcon.setAttribute('aria-disabled','true');else bFalcon.removeAttribute('aria-disabled');}
function toggleSlow(){S.slow=!S.slow;bSlow.setAttribute('aria-pressed',S.slow);}
bFalcon.onclick=e=>{launchFalcon();e.currentTarget.blur();};
bSplit.onclick=e=>{forceSplit();e.currentTarget.blur();};
bSlow.onclick=e=>{toggleSlow();e.currentTarget.blur();};
const cnt=document.getElementById('count'),cntOut=document.getElementById('countOut');
cnt.oninput=()=>{resizeFlock(+cnt.value);cntOut.textContent=cnt.value;};
cnt.onchange=()=>cnt.blur();
const MOVE=new Set(['KeyW','KeyA','KeyS','KeyD','KeyC','Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight']);
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.ctrlKey||e.metaKey||e.altKey)return;
  const c=e.code;
  if(MOVE.has(c)){e.preventDefault();keysDown.add(c);if(cam.mode!=='fly')setMode('fly');return;}
  if(c==='ShiftLeft'||c==='ShiftRight'){keysDown.add('Shift');return;}
  if(e.repeat)return;
  if(c==='KeyF')launchFalcon();else if(c==='KeyX')forceSplit();else if(c==='KeyT')toggleSlow();
  else if(c>='Digit1'&&c<='Digit4')setMode(MODES[+c.slice(5)-1]);
});
addEventListener('keyup',e=>{const c=e.code;if(c==='Space')e.preventDefault();keysDown.delete(c);if(c==='ShiftLeft'||c==='ShiftRight')keysDown.delete('Shift');});
addEventListener('blur',()=>keysDown.clear());

const n0=coarse?600:1000;cnt.value=n0;cntOut.textContent=n0;spawn(n0);
advance(1.5);resize();
for(let i=0;i<40;i++)updateCamera(.2);
showHint();
window.__sim={S,cam,FALS,ESC,TT,LAB,CLn,CLr,getP:()=>P,getNC:()=>NC,advance,setMode,launchFalcon,forceSplit,startTurn,updateCamera,render,
  count:()=>({nStatic,nProps,nd,drawn,n:S.n,cap:CAP})};
requestAnimationFrame(t=>{last=t/1000;frame(t);});
})();
</script>
