<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Splatterhouse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: full-bleed canvas; a thin readout top-left, one control dock pinned bottom-centre */
  --ink:#f6f1e4;
  --ink-dim:rgba(246,241,228,.66);
  --glass:rgba(24,30,20,.5);
  --edge:rgba(246,241,228,.2);
  --accent:#ffcf5c;
  --hot:#ff7a4d;
  --display:'Barlow Condensed','Arial Narrow','Helvetica Neue',system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#7d9a5c;overflow:hidden;color:var(--ink);font-family:var(--display);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
#tag{position:fixed;left:16px;top:14px;display:flex;flex-direction:column;gap:2px;pointer-events:none;
  text-shadow:0 1px 6px rgba(0,0,0,.45)}
#tag b{font-weight:600;font-size:21px;letter-spacing:.09em;text-transform:uppercase}
#stats{font-family:var(--mono);font-size:11px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
#hint{position:fixed;left:0;right:0;bottom:142px;text-align:center;font-size:15px;letter-spacing:.06em;color:var(--ink-dim);
  pointer-events:none;transition:opacity .6s;text-shadow:0 1px 6px rgba(0,0,0,.5)}
#hint.off{opacity:0}
#dock{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:10px;
  padding:12px 14px;border-radius:18px;background:var(--glass);border:1px solid var(--edge);
  -webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);
  width:max-content;max-width:calc(100% - 32px)}
.row{display:flex;gap:8px;align-items:center;justify-content:center}
button{font:600 17px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);
  height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--edge);background:rgba(246,241,228,.07);cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;border:1px solid var(--edge);border-radius:12px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;color:var(--ink-dim)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#2a2410}
.act:active{background:var(--accent);color:#2a2410}
.act.fire:active{background:var(--hot);color:#2a1208}
.sl{gap:12px;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}
.sl span{white-space:nowrap}
input[type=range]{flex:1;min-width:120px;accent-color:var(--accent);height:24px}
#err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;
  font-size:20px;background:#39452c}
#err[hidden]{display:none}
@media (prefers-reduced-motion:reduce){#hint{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tag"><b>Splatterhouse</b><span id="stats">building splats</span></div>
<div id="hint">Drag to orbit · pinch or scroll to zoom</div>
<div id="dock">
  <div class="row">
    <div class="seg" role="group" aria-label="Pace">
      <button id="bWalk" type="button" aria-pressed="false">Walk</button>
      <button id="bRun" type="button" aria-pressed="true">Run</button>
    </div>
    <button id="bSlash" type="button" class="act">Slash</button>
    <button id="bFire" type="button" class="act fire">Fire</button>
  </div>
  <label class="row sl" for="size"><span>Splat size</span>
    <input id="size" type="range" min="0.12" max="1.5" step="0.01" value="1"></label>
</div>
<div id="err" hidden>This demo needs WebGL2, which this browser did not provide. Try a current Safari, Chrome or Firefox.</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('c');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,depth:false,stencil:false,powerPreference:'high-performance'});
if(!gl){document.getElementById('err').hidden=false;return;}

/* ---------------------------------------------------------------- utils */
let seed=20261115;
function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const mix3=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
function quatFromBasis(x,y,z){
  const m00=x[0],m10=x[1],m20=x[2],m01=y[0],m11=y[1],m21=y[2],m02=z[0],m12=z[1],m22=z[2];
  const tr=m00+m11+m22;let s;
  if(tr>0){s=Math.sqrt(tr+1)*2;return[(m21-m12)/s,(m02-m20)/s,(m10-m01)/s,.25*s];}
  if(m00>m11&&m00>m22){s=Math.sqrt(1+m00-m11-m22)*2;return[.25*s,(m01+m10)/s,(m02+m20)/s,(m21-m12)/s];}
  if(m11>m22){s=Math.sqrt(1+m11-m00-m22)*2;return[(m01+m10)/s,.25*s,(m12+m21)/s,(m02-m20)/s];}
  s=Math.sqrt(1+m22-m00-m11)*2;return[(m02+m20)/s,(m12+m21)/s,.25*s,(m10-m01)/s];
}
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
function nrm(v){const l=Math.hypot(v[0],v[1],v[2])||1;return[v[0]/l,v[1]/l,v[2]/l];}

/* ------------------------------------------------------ splat storage */
const coarse=matchMedia('(pointer:coarse)').matches||Math.min(innerWidth,innerHeight)<620;
const L=36,RF=17,D0SQ=36,FMIN=0.12;
const DENS=coarse?108:156;
const NGX=Math.round(L/0.7),nGround=NGX*NGX,nTuft=Math.round(DENS*L*L);
const CAP=Math.ceil((nGround+2*nTuft+40000)/512)*512;
const D=new Float32Array(CAP*16);let N=0;
function add(px,py,pz,bone,sx,sy,sz,op,q,r,g,b,aux){
  const o=N*16;D[o]=px;D[o+1]=py;D[o+2]=pz;D[o+3]=bone;D[o+4]=sx;D[o+5]=sy;D[o+6]=sz;D[o+7]=op;
  D[o+8]=q[0];D[o+9]=q[1];D[o+10]=q[2];D[o+11]=q[3];D[o+12]=r;D[o+13]=g;D[o+14]=b;D[o+15]=aux;return N++;
}

/* --------------------------------------------------------------- field */
function makeNoise(n){const g=new Float32Array(n*n);for(let i=0;i<g.length;i++)g[i]=rnd();
  return(x,z)=>{const u=((x/L+.5)%1+1)%1*n,v=((z/L+.5)%1+1)%1*n;const i=Math.floor(u),j=Math.floor(v);
    const fu=smooth(u-i),fv=smooth(v-j),i1=(i+1)%n,j1=(j+1)%n;
    return lerp(lerp(g[j*n+i],g[j*n+i1],fu),lerp(g[j1*n+i],g[j1*n+i1],fu),fv);};}
const nA=makeNoise(7),nB=makeNoise(13),nC=makeNoise(29);
const G_LUSH=[.25,.47,.13],G_DRY=[.58,.58,.25],G_DARK=[.10,.27,.10],G_TIP=[.70,.74,.33];
const FLAT=[-0.70710678,0,0,0.70710678];
for(let ix=0;ix<NGX;ix++)for(let iz=0;iz<NGX;iz++){
  const x=-L/2+(ix+rnd())*L/NGX,z=-L/2+(iz+rnd())*L/NGX,n=nB(x,z),s=.5+.16*rnd(),j=.85+.3*rnd();
  const c=mix3([.12,.21,.07],[.24,.20,.10],smooth(n*1.6-.5));
  add(x,0,z,0,s,s,.03,1,FLAT,c[0]*j,c[1]*j,c[2]*j,0);
}
const FLOWERS=[[.97,.95,.88],[.98,.82,.22],[.72,.52,.92],[.93,.28,.22],[.97,.95,.88]];
const fLod=new Float32Array(CAP),fLodQ=new Float32Array(CAP);
for(let i=0;i<nTuft;i++){
  const x=(rnd()-.5)*L,z=(rnd()-.5)*L,a=nA(x,z),b=nB(x,z),c2=nC(x,z);
  const lod=rnd(),kind=rnd(),ang=rnd()*6.2832,lean=.08+.26*rnd();
  const lx=Math.cos(ang)*lean,lz=Math.sin(ang)*lean;
  const yv=nrm([lx,1,lz]),ha=rnd()*6.2832,hv=[Math.cos(ha),0,Math.sin(ha)],dd=hv[0]*yv[0]+hv[2]*yv[2];
  const xv=nrm([hv[0]-yv[0]*dd,-yv[1]*dd,hv[2]-yv[2]*dd]),zv=cross(xv,yv),q=quatFromBasis(xv,yv,zv);
  let col=mix3(G_LUSH,G_DRY,smooth(b*1.5-.35));col=mix3(col,G_DARK,a*.55);
  const j=.82+.36*rnd()+(c2-.5)*.25;col=[col[0]*j,col[1]*j,col[2]*j];
  const first=N;
  if(kind<.03){
    const h=.55+.32*rnd();
    add(x+lx*h*.5,h*.5,z+lz*h*.5,0,.007,h*.3,.007,.9,q,.55*j,.52*j,.27*j,.5);
    add(x+lx*h,h*.98,z+lz*h,0,.015,.055,.015,.95,q,.80*j,.66*j,.30*j,.99);
  }else if(kind<.058){
    const h=.30+.22*rnd(),f=FLOWERS[(rnd()*FLOWERS.length)|0],r=.022+.012*rnd();
    add(x+lx*h*.45,h*.45,z+lz*h*.45,0,.008,h*.28,.008,.9,q,col[0]*.8,col[1]*.8,col[2]*.8,.4);
    add(x+lx*h,h,z+lz*h,0,r,r*.75,r,.97,[0,0,0,1],f[0],f[1],f[2],.97);
  }else{
    const h=(.20+.30*Math.pow(rnd(),1.4))*(.72+.6*a),w=.010+.013*rnd(),tip=mix3(col,G_TIP,.42);
    add(x+lx*h*.3,h*.3,z+lz*h*.3,0,w,h*.3,w*.55,.9,q,col[0]*.58,col[1]*.6,col[2]*.58,.36);
    add(x+lx*h*.68,h*.68,z+lz*h*.68,0,w*.8,h*.27,w*.45,.88,q,tip[0],tip[1],tip[2],.96);
  }
  const lq=Math.pow(lod,4/3);for(let k=first;k<N;k++){fLod[k]=lod;fLodQ[k]=lq;}
}
const nField=N;

/* --------------------------------------------------------- far scenery */
const B={PEL:1,SPI:2,CHE:3,HEAD:4,LTH:5,LSH:6,LFT:7,RTH:8,RSH:9,RFT:10,LUA:11,LFA:12,LHA:13,RUA:14,RFA:15,RHA:16,SWD:17,GUN:18,SCF:19,FAR:20,FLASH:21,GH:22};
const NB=27;
const HAZE=[.93,.85,.72];
const qY=a=>[0,Math.sin(a/2),0,Math.cos(a/2)];
for(let i=0;i<34;i++){const a=i/34*6.2832+rnd()*.2,d=900+rnd()*400,h=14+rnd()*30;
  const c=mix3([.33,.45,.50],HAZE,.45+.2*rnd());
  add(Math.sin(a)*d,h*.3,Math.cos(a)*d,B.FAR,90+rnd()*120,h,60,.97,qY(a),c[0],c[1],c[2],0);}
for(let i=0;i<260;i++){const a=rnd()*6.2832,d=170+rnd()*260,h=2+rnd()*2.4;
  const c=mix3([.12,.25,.12],HAZE,.85*(1-Math.exp(-d*.0024))),j=.8+.4*rnd();
  add(Math.sin(a)*d,h*.85,Math.cos(a)*d,B.FAR,2.5+rnd()*4,h,3,.95,qY(a),c[0]*j,c[1]*j,c[2]*j,0);}
for(let i=0;i<16;i++){const a=rnd()*6.2832,d=900+rnd()*900,y=330+rnd()*420;
  for(let k=0;k<7;k++){const w=45+rnd()*60,j=.93+.07*rnd();
    add(Math.sin(a)*d+(rnd()-.5)*210,y+(rnd()-.5)*30+(k?0:-14),Math.cos(a)*d+(rnd()-.5)*210,B.FAR,w,11+rnd()*10,w*.7,.62,qY(a),1*j,.97*j,.92*j,0);}}

/* ------------------------------------------------------------ the man */
function tube(bone,o){
  const a=o.a,b=o.b;let ux=b[0]-a[0],uy=b[1]-a[1],uz=b[2]-a[2];const len=Math.hypot(ux,uy,uz);ux/=len;uy/=len;uz/=len;
  const xr=o.x||[1,0,0],d=xr[0]*ux+xr[1]*uy+xr[2]*uz,ex=nrm([xr[0]-ux*d,xr[1]-uy*d,xr[2]-uz*d]),ez=cross(ex,[ux,uy,uz]);
  const r0x=o.r0[0],r0z=o.r0[1],r1x=(o.r1||o.r0)[0],r1z=(o.r1||o.r0)[1];
  const ca=o.ca??.15,cb=o.cb??.15,p=o.p||2,s=o.s||.013,spec=o.spec||0,op=o.op??.93;
  const n=o.n||Math.max(10,Math.round(.55*Math.PI*(r0x+r0z+r1x+r1z)/2*len/(s*s)));
  const rmax=Math.max(r0x+r0z,r1x+r1z);let made=0,guard=0;
  while(made<n&&guard++<n*40){
    const t=rnd(),th=rnd()*6.28318,rx=lerp(r0x,r1x,t),rz=lerp(r0z,r1z,t);let m=1,ax=0;
    if(ca>0&&t<ca){const k=1-t/ca;m=Math.sqrt(1-k*k);ax=-k/(ca*len);}
    else if(cb>0&&t>1-cb){const k=1-(1-t)/cb;m=Math.sqrt(1-k*k);ax=k/(cb*len);}
    else if(rnd()>(rx+rz)/rmax)continue;
    const c=Math.cos(th),sn=Math.sin(th),e=2/p;
    const cx=Math.sign(c)*Math.pow(Math.abs(c),e),cz=Math.sign(sn)*Math.pow(Math.abs(sn),e),ox=rx*m*cx,oz=rz*m*cz;
    const P=[a[0]+ux*len*t+ex[0]*ox+ez[0]*oz,a[1]+uy*len*t+ex[1]*ox+ez[1]*oz,a[2]+uz*len*t+ex[2]*ox+ez[2]*oz];
    let gx=Math.sign(c)*Math.pow(Math.abs(cx),p-1)/rx,gz=Math.sign(sn)*Math.pow(Math.abs(cz),p-1)/rz;
    const gl_=Math.hypot(gx,gz)||1,rw=m/((rx+rz)*.5);gx=gx/gl_*rw;gz=gz/gl_*rw;
    const nv=nrm([ex[0]*gx+ez[0]*gz+ux*ax,ex[1]*gx+ez[1]*gz+uy*ax,ex[2]*gx+ez[2]*gz+uz*ax]);
    const col=o.col(P,t,nv);if(!col)continue;
    const h=Math.abs(nv[1])<.9?[0,1,0]:[1,0,0],t1=nrm(cross(h,nv)),bt=cross(nv,t1),ph=rnd()*6.28318,cp=Math.cos(ph),sp=Math.sin(ph);
    const tx=[t1[0]*cp+bt[0]*sp,t1[1]*cp+bt[1]*sp,t1[2]*cp+bt[2]*sp],ty=cross(nv,tx),j=.9+.2*rnd();
    add(P[0],P[1],P[2],bone,s*(1+.6*rnd()),s*(.7+.4*rnd()),s*.3,op,quatFromBasis(tx,ty,nv),col[0]*j,col[1]*j,col[2]*j,spec);made++;
  }
}
const C={skin:[.87,.65,.51],hair:[.15,.10,.07],coat:[.20,.24,.42],shirt:[.90,.86,.76],scarf:[.82,.15,.12],
  trou:[.66,.56,.39],boot:[.21,.14,.10],leather:[.36,.23,.13],steel:[.80,.84,.90],gunm:[.17,.18,.22],brass:[.84,.64,.26],wood:[.44,.26,.13]};
const flat=c=>()=>c;
// pelvis, torso
tube(B.PEL,{a:[0,.09,0],b:[0,-.13,0],r0:[.150,.105],r1:[.158,.110],ca:.2,cb:.45,col:flat(C.trou)});
tube(B.PEL,{a:[0,.10,0],b:[0,-.17,0],r0:[.162,.117],r1:[.188,.138],ca:0,cb:0,col:P=>(P[2]>.05&&Math.abs(P[0])<.03-P[1]*.12)?null:C.coat});
tube(B.SPI,{a:[0,-.03,0],b:[0,.17,0],r0:[.158,.112],r1:[.168,.118],ca:0,cb:0,col:flat(C.coat)});
tube(B.SPI,{a:[0,-.02,0],b:[0,.03,0],r0:[.168,.122],r1:[.170,.124],ca:0,cb:0,s:.009,spec:.3,col:P=>(P[2]>.09&&Math.abs(P[0])<.035)?C.brass:C.leather});
tube(B.CHE,{a:[0,-.02,0],b:[0,.30,0],r0:[.168,.118],r1:[.200,.126],ca:0,cb:.3,col:P=>(P[2]>.06&&Math.abs(P[0])<(P[1]-.06)*.22)?C.shirt:C.coat});
for(const sx of[1,-1])tube(B.CHE,{a:[sx*.205,.292,0],b:[sx*.205,.175,0],r0:[.054,.060],ca:.5,cb:.5,col:flat(C.coat)});
tube(B.CHE,{a:[0,.27,0],b:[0,.38,.005],r0:[.050,.053],ca:0,cb:0,s:.009,col:flat(C.skin)});
tube(B.CHE,{a:[0,.262,0],b:[0,.338,0],r0:[.088,.094],r1:[.072,.078],ca:.3,cb:.3,s:.010,col:flat(C.scarf)});
tube(B.SCF,{a:[0,0,0],b:[0,-.36,-.03],r0:[.046,.012],r1:[.030,.008],ca:.1,cb:.2,s:.009,n:240,col:flat(C.scarf)});
// head
const isHair=P=>P[2]>-.02?P[1]>.062+(P[2]+.02)*.98:P[1]>.035;
tube(B.HEAD,{a:[0,.235,.012],b:[0,0,.012],r0:[.082,.098],ca:.5,cb:.5,s:.0085,col:P=>isHair(P)?C.hair:C.skin});
tube(B.HEAD,{a:[0,.252,0],b:[0,.07,-.012],r0:[.091,.108],ca:.6,cb:.1,s:.010,n:520,col:P=>isHair([P[0],P[1]-.006,P[2]])?C.hair:null});
tube(B.HEAD,{a:[0,.128,.104],b:[0,.088,.118],r0:[.011,.012],ca:.4,cb:.5,s:.006,n:26,col:flat([.80,.58,.45])});
for(const sx of[1,-1]){add(sx*.031,.128,.106,B.HEAD,.011,.006,.004,.95,[0,0,0,1],.08,.06,.05,.6);
  add(sx*.031,.148,.103,B.HEAD,.017,.005,.004,.9,[0,0,0,1],.13,.09,.06,0);}
// legs
for(const[TH,SH,FT]of[[B.LTH,B.LSH,B.LFT],[B.RTH,B.RSH,B.RFT]]){
  tube(TH,{a:[0,.03,0],b:[0,-.45,0],r0:[.082,.090],r1:[.058,.062],ca:.12,cb:.1,col:flat(C.trou)});
  tube(SH,{a:[0,.03,0],b:[0,-.15,0],r0:[.060,.064],r1:[.054,.057],ca:.2,cb:0,col:flat(C.trou)});
  tube(SH,{a:[0,-.11,0],b:[0,-.45,0],r0:[.067,.071],r1:[.050,.054],ca:.05,cb:.1,col:(P,t)=>t<.14?C.leather:C.boot});
  tube(FT,{a:[0,-.022,-.06],b:[0,-.036,.185],r0:[.047,.040],r1:[.043,.027],ca:.2,cb:.25,p:2.6,s:.011,col:flat(C.boot)});
}
// arms
for(const[UA,FA,HA]of[[B.LUA,B.LFA,B.LHA],[B.RUA,B.RFA,B.RHA]]){
  tube(UA,{a:[0,.03,0],b:[0,-.30,0],r0:[.052,.055],r1:[.043,.045],col:flat(C.coat)});
  tube(FA,{a:[0,.02,0],b:[0,-.265,0],r0:[.044,.046],r1:[.034,.036],col:(P,t)=>t<.58?C.coat:C.leather});
  tube(HA,{a:[0,.005,0],b:[0,-.10,0],r0:[.027,.043],ca:.4,cb:.5,s:.009,col:flat([.25,.17,.12])});
}
// sword (model along +Y, edge along X)
tube(B.SWD,{a:[0,-.085,0],b:[0,.07,0],r0:[.014,.016],s:.006,col:flat([.30,.10,.09])});
tube(B.SWD,{a:[0,-.128,0],b:[0,-.082,0],r0:[.023,.023],ca:.5,cb:.5,s:.006,spec:.7,col:flat(C.brass)});
tube(B.SWD,{a:[-.105,.082,0],b:[.105,.082,0],x:[0,1,0],r0:[.013,.016],s:.006,spec:.7,col:flat(C.brass)});
tube(B.SWD,{a:[0,.09,0],b:[0,1.02,0],r0:[.031,.0055],r1:[.021,.0035],ca:.02,cb:.07,p:3.2,s:.0075,spec:.55,op:.97,col:flat(C.steel)});
// pistol (barrel along -Y, grip toward -Z of the hand)
const GK=1.3,gv=v=>[v[0]*GK,v[1]*GK,v[2]*GK];
tube(B.GUN,{a:gv([0,.005,.03]),b:gv([0,.03,-.085]),r0:[.013*GK,.021*GK],p:3,s:.006,col:flat(C.wood)});

function frame(now){
  requestAnimationFrame(frame);
  const t=now/1000,dt=Math.min(.05,Math.max(0,t-last));last=t;
  if(!S.frozen){pose(dt);if(cam.auto)cam.yaw+=dt*.07;}
  render();
  fpsN++;fpsT+=dt;
  if(dt>.03)slow++;else slow=Math.max(0,slow-1);
  if(slow>50&&scale>.55){scale*=.85;slow=0;}
  if(fpsT>=.5){stats.textContent=drawn.toLocaleString()+' splats · '+Math.round(fpsN/fpsT)+' fps';fpsT=fpsN=0;}
}
function render(){
  resize();
  const{f,r,u}=lookAt();
  drawn=buildOrder();
  gl.viewport(0,0,VW,VH);
  gl.disable(gl.BLEND);gl.useProgram(BP);gl.bindVertexArray(bvao);
  gl.uniform3f(BU.uR,r[0]*tanX,r[1]*tanX,r[2]*tanX);gl.uniform3f(BU.uU,u[0]*tanY,u[1]*tanY,u[2]*tanY);gl.uniform3f(BU.uF,f[0],f[1],f[2]);
  gl.uniform3fv(BU.uSun,SUN);gl.uniform3fv(BU.uGround,GROUND);gl.uniform3fv(BU.uCam,cam.pos);gl.uniform2f(BU.uScrollW,S.wx,S.wz);
  gl.drawArrays(gl.TRIANGLES,0,3);
  gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(P);gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER,ib);gl.bufferSubData(gl.ARRAY_BUFFER,0,order,0,drawn);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.uniform1i(U.uData,0);
  gl.uniformMatrix4fv(U.uView,false,view);gl.uniformMatrix4fv(U.uProj,false,proj);
  gl.uniform2f(U.uViewport,VW,VH);gl.uniform1f(U.uFocal,focal);gl.uniform2f(U.uLim,tanX*1.3,tanY*1.3);
  gl.uniformMatrix4fv(U.uBones,false,bones);
  gl.uniform4f(U.uField,L,RF,S.time,splatScale);gl.uniform2f(U.uScroll,S.sx,S.sz);
  gl.uniform3fv(U.uSun,SUN);gl.uniform3fv(U.uCam,cam.pos);gl.uniform3fv(U.uGround,GROUND);
  const gm=W[B.GUN];
  gl.uniform4f(U.uFx,S.flash,gm[4]*MZ[1]+gm[8]*MZ[2]+gm[12],gm[5]*MZ[1]+gm[9]*MZ[2]+gm[13],gm[6]*MZ[1]+gm[10]*MZ[2]+gm[14]);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,drawn);
}

/* --------------------------------------------------------------- input */
const hint=document.getElementById('hint'),pts=new Map();let pinch=0;
function touched(){cam.auto=false;hint.classList.add('off');}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);pinch=0;touched();});
canvas.addEventListener('pointermove',e=>{
  const p=pts.get(e.pointerId);if(!p)return;const dx=e.clientX-p[0],dy=e.clientY-p[1];p[0]=e.clientX;p[1]=e.clientY;
  if(pts.size===1){cam.yaw-=dx*.0075;cam.pitch=clamp(cam.pitch+dy*.006,.02,1.25);}
  else if(pts.size===2){const[a,b]=[...pts.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch)cam.dist=clamp(cam.dist*pinch/d,1.6,14);pinch=d;}
});
const up=e=>{pts.delete(e.pointerId);pinch=0;};
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('wheel',e=>{e.preventDefault();cam.dist=clamp(cam.dist*Math.exp(e.deltaY*.0012),1.6,14);touched();},{passive:false});
const bWalk=document.getElementById('bWalk'),bRun=document.getElementById('bRun');
function pace(run){S.gT=run?1:0;bRun.setAttribute('aria-pressed',run);bWalk.setAttribute('aria-pressed',!run);}
bWalk.onclick=()=>pace(false);bRun.onclick=()=>pace(true);
const slash=()=>{if(S.slash<0||S.slash>.6)S.slash=0;};
const fire=()=>{S.fire=S.fire>.12&&S.fire<.6?.12:(S.fire<0?0:S.fire);};
document.getElementById('bSlash').onclick=slash;document.getElementById('bFire').onclick=fire;
document.getElementById('size').oninput=e=>{splatScale=+e.target.value;};
addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key.toLowerCase();
  if(k===' '||k==='e'){e.preventDefault();slash();}else if(k==='f')fire();else if(k==='shift'||k==='r')pace(S.gT<.5);});
window.__splat={S,cam,pose,render,slash,fire,pace,count:()=>({N,nField,drawn})};
requestAnimationFrame(t=>{last=t/1000;frame(t);});
})();
</script>
